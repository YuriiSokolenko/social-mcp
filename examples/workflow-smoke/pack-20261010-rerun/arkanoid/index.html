<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arkanoid — workflow smoke</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.mjs"></script>
  </head>
  <body>
    <main class="game">
      <h1>Arkanoid</h1>

      <section aria-labelledby="board-heading">
        <h2 id="board-heading" class="visually-hidden">Game board</h2>
        <canvas
          id="board"
          width="640"
          height="480"
          aria-label="Arkanoid board"
          tabindex="0"
        ></canvas>
      </section>

      <section class="panel" aria-labelledby="panel-heading">
        <h2 id="panel-heading" class="visually-hidden">Score and controls</h2>
        <p class="stats">
          <span>Score: <span id="score" class="score">0</span></span>
          <span>Lives: <span id="lives" class="score">3</span></span>
          <span>Bricks: <span id="bricks" class="score">0</span></span>
        </p>
        <p id="status" role="status" aria-live="polite">
          Press start, then use arrow keys, A/D, mouse, or touch.
        </p>

        <div class="controls">
          <button id="start" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="restart" type="button" disabled>Restart</button>
        </div>

        <fieldset class="touch">
          <legend>Paddle</legend>
          <button type="button" data-move="left" aria-label="Move paddle left">◀</button>
          <button type="button" data-move="right" aria-label="Move paddle right">▶</button>
        </fieldset>

        <p class="hint">
          Arrow keys or A/D steer the paddle. Space or Enter starts and serves.
          P pauses. Tap the board to move the paddle; tap again to pause.
        </p>
      </section>
    </main>
  </body>
</html>
