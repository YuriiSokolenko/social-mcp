<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arkanoid — workflow smoke</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Arkanoid</h1>
      <canvas id="board" aria-label="Arkanoid playfield"></canvas>
      <section class="panel" aria-label="Game controls">
        <p>Score: <strong id="score">0</strong></p>
        <p>Lives: <strong id="lives">3</strong></p>
        <p id="status" role="status" aria-live="polite">Ready — press Start.</p>
        <div class="actions">
          <button id="start" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="restart" type="button" disabled>Restart</button>
        </div>
        <div class="touchpad" aria-label="Touch controls">
          <h2 class="visually-hidden">Touch controls</h2>
          <button type="button" data-direction="left" aria-label="Move paddle left">Left</button>
          <button type="button" data-direction="right" aria-label="Move paddle right">Right</button>
        </div>
        <p class="hint">Arrows / A-D or pointer steers the paddle. Tap the canvas to pause. Click Start, tap keys, click buttons, restart.</p>
      </section>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
