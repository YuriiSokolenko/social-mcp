name: Verify run_check sandbox on Beelink

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    # This manual check is meaningful only on the existing production Pi pool.
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 20
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record Beelink runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "PR commit tested: $(git rev-parse HEAD)"
          echo "Runner name: ${RUNNER_NAME:-unavailable}"
          echo "Expected runner labels: n150,pi-agent (enforced by runs-on)"
          echo "Runner OS/arch: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "Hostname: $(hostname)"
          echo "Container identity: $(cat /etc/hostname 2>/dev/null || true)"
          echo "PID 1 cgroup:"
          cat /proc/1/cgroup 2>/dev/null || true
          echo "Worker OS:"
          cat /etc/os-release
          echo "Current runner user: $(id)"

      - name: Exercise the real Pi runtime preflight and shared checks
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/pi-run-check-sandbox-smoke"
          mkdir -p "$smoke/tests"
          cp "$GITHUB_WORKSPACE/pyproject.toml" "$smoke/pyproject.toml"
          cat > "$smoke/valid.py" <<'PY'
          print("valid")
          PY
          cat > "$smoke/invalid.py" <<'PY'
          def broken(:
              pass
          PY
          cat > "$smoke/ruff-valid.py" <<'PY'
          def answer():
              return 42
          PY
          cat > "$smoke/ruff-invalid.py" <<'PY'
          import os
          PY
          cat > "$smoke/tests/test_smoke.py" <<'PY'
          import os
          import socket
          import time

          def test_pass():
              assert 2 + 2 == 4

          def test_fail():
              assert 2 + 2 == 5

          def test_timeout():
              time.sleep(30)

          def test_sandbox_policy():
              assert os.getuid() != 0
              with open('/proc/self/status', encoding='utf-8') as stream:
                  status = dict(line.split(':', 1) for line in stream if line.startswith(('CapEff:', 'NoNewPrivs:')))
              assert status['CapEff'].strip() == '0000000000000000'
              assert status['NoNewPrivs'].strip() == '1'
              assert sorted(os.listdir('/sys/class/net')) == ['lo']
              assert not os.path.exists('/var/run/docker.sock')
              assert all(not os.path.exists(item) for item in ('/home/runner', '/pi-config-ro', '/host', '/var/run/secrets'))
              assert not any(any(marker in key.upper() for marker in ('TOKEN', 'SECRET', 'API_KEY', 'ACCESS_KEY', 'GITHUB', 'MODEL', 'OPENAI', 'ANTHROPIC', 'SSH_AUTH_SOCK')) for key in os.environ)
              probe = socket.socket()
              probe.settimeout(1)
              try:
                  assert probe.connect_ex(('1.1.1.1', 443)) != 0
              finally:
                  probe.close()
          PY

          cat > "$smoke/loader.mjs" <<'JS'
          export async function resolve(specifier, context, nextResolve) {
            if (specifier === 'typebox') {
              const source = 'export const Type = new Proxy({}, { get: () => (...args) => ({}) });';
              return { url: 'data:text/javascript,' + encodeURIComponent(source), shortCircuit: true };
            }
            return nextResolve(specifier, context);
          }
          JS
          cat > "$smoke/runtime.mjs" <<'JS'
          import assert from 'node:assert/strict';
          const handlers = new Map();
          const pi = {
            on: (name, handler) => handlers.set(name, handler),
            registerTool: () => {}, getActiveTools: () => [], setActiveTools: () => {},
            sendUserMessage: async () => {}, setModel: async () => true,
          };
          const { default: extension } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pi-agent-runtime.mjs`);
          extension(pi);
          assert.equal(typeof handlers.get('session_start'), 'function');
          await handlers.get('session_start')({}, {
            model: { provider: 'smoke', id: 'smoke', maxTokens: 32000 },
            cwd: process.env.GITHUB_WORKSPACE,
          });
          JS
          printf '{"title":"sandbox smoke","body":"runtime preflight"}\n' > "$smoke/issue.json"
          PI_STAGE=implementer PI_ISSUE=242 PI_ISSUE_CONTEXT="$smoke/issue.json" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            node --no-warnings --experimental-loader "$smoke/loader.mjs" "$smoke/runtime.mjs" 2>&1 | tee "$smoke/runtime.log"
          node --input-type=module - "$smoke/runtime.log" <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const line = fs.readFileSync(process.argv[2], 'utf8').split('\n').find(item => item.includes('PI_RUN_CHECK_PREFLIGHT '));
          assert.ok(line, 'runtime must emit PI_RUN_CHECK_PREFLIGHT');
          const record = JSON.parse(line.slice(line.indexOf('PI_RUN_CHECK_PREFLIGHT ') + 'PI_RUN_CHECK_PREFLIGHT '.length));
          console.log(`PREFLIGHT_EVIDENCE ${JSON.stringify(record)}`);
          assert.equal(record.ok, true);
          assert.match(record.pi_runner.name, /^n150-pi-eph-/);
          assert.match(record.pi_runner.labels, /n150/);
          assert.match(record.pi_runner.labels, /pi-agent/);
          assert.equal(record.pi_runner.user, 'runner');
          assert.equal(record.pi_runner.privileged, false);
          assert.deepEqual(record.pi_runner.cap_add, []);
          assert.deepEqual(record.pi_runner.security_options, []);
          assert.equal(record.pi_runner.docker_socket_absent, true);
          assert.equal(record.sandbox.uid, 1001);
          assert.equal(record.sandbox.effective_capabilities, '0000000000000000');
          assert.equal(record.sandbox.no_new_privileges, true);
          assert.equal(record.sandbox.network_disabled, true);
          assert.deepEqual(record.sandbox.network_interfaces, ['lo']);
          assert.equal(record.sandbox.docker_socket_absent, true);
          assert.equal(record.sandbox.worktree_readable, true);
          assert.equal(record.sandbox.host_paths_absent, true);
          assert.equal(record.sandbox.secret_environment_absent, true);
          console.log('RUNNER_PRIVILEGE_PROFILE_OK=true SANDBOX_ISOLATION_OK=true');
          JS

          cat > "$smoke/checks.mjs" <<'JS'
          import assert from 'node:assert/strict';
          const { runCheck } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pi-common/run-check.mjs`);
          const root = `${process.env.RUNNER_TEMP}/pi-run-check-sandbox-smoke`;
          const cases = {
            python_valid: await runCheck(root, { kind: 'python_compile', paths: ['valid.py'] }),
            python_invalid: await runCheck(root, { kind: 'python_compile', paths: ['invalid.py'] }),
            ruff_valid: await runCheck(root, { kind: 'ruff', paths: ['ruff-valid.py'] }),
            ruff_invalid: await runCheck(root, { kind: 'ruff', paths: ['ruff-invalid.py'] }),
            pytest_valid: await runCheck(root, { kind: 'pytest', targets: ['tests/test_smoke.py::test_pass'] }),
            pytest_invalid: await runCheck(root, { kind: 'pytest', targets: ['tests/test_smoke.py::test_fail'] }),
            pytest_policy: await runCheck(root, { kind: 'pytest', targets: ['tests/test_smoke.py::test_sandbox_policy'] }),
            pytest_timeout: await runCheck(root, { kind: 'pytest', targets: ['tests/test_smoke.py::test_timeout'] }, { timeoutSeconds: 2 }),
          };
          for (const [name, result] of Object.entries(cases)) console.log(`RUN_CHECK_${name.toUpperCase()} ${JSON.stringify(result)}`);
          assert.equal(cases.python_valid.status, 'pass');
          assert.equal(cases.python_invalid.status, 'fail');
          assert.notEqual(cases.python_invalid.exit_code, 0);
          assert.match(`${cases.python_invalid.stdout_tail}\n${cases.python_invalid.stderr_tail}`, /SyntaxError|invalid syntax|expected/i);
          assert.equal(cases.ruff_valid.status, 'pass');
          assert.equal(cases.ruff_invalid.status, 'fail');
          assert.equal(cases.pytest_valid.status, 'pass');
          assert.equal(cases.pytest_invalid.status, 'fail');
          assert.equal(cases.pytest_policy.status, 'pass');
          assert.equal(cases.pytest_timeout.status, 'timeout');
          assert.equal(cases.pytest_timeout.sandbox_container_removed, true);
          for (const [name, result] of Object.entries(cases)) {
            assert.notEqual(result.status, 'infra_error', `${name} unexpectedly failed as infrastructure`);
            assert.equal(result.sandbox_image, process.env.RUN_CHECK_SANDBOX_IMAGE || result.sandbox_image);
            if (!name.includes('timeout')) assert.equal(result.sandbox_container_removed, true, `${name} sandbox container must be removed`);
          }
          console.log('NO_UNRESTRICTED_BASH_FALLBACK=true source=scripts/pi-common/run-check.mjs');
          JS
          GITHUB_TOKEN=smoke-sentinel OPENAI_API_KEY=smoke-sentinel node "$smoke/checks.mjs"

      - name: Historical evidence limitation
        if: always()
        shell: bash
        run: |
          echo "Historical Rabbit/Beelink logs for failed run 36747125572 are not available inside this GitHub Actions job."
          echo "Known from that investigation: the worker image lacked bwrap. The follow-up bwrap permission failure is caused by the existing nested namespace/mount restriction; this workflow does not alter runner privileges."
