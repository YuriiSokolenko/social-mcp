name: CI Terminal Wake
run-name: "🔔 CI terminal wake · ${{ github.event.workflow_run.id }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-terminal-wake-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  wake-pr-merge-gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Control-plane bridge: keep this off the scarce n150/general CI pool.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Wake Merge Gate after terminal PR CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-common/workflow-dispatch.mjs pi-auto-merge.yml
