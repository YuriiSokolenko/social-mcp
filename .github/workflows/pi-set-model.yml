name: Pi Set Model
run-name: "Set default Pi model → ${{ inputs.model }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: Default model for Pi runs (does not start/stop anything on nano)
        required: true
        type: choice
        options:
          - laguna
          - qwen

permissions:
  actions: write

jobs:
  set-model:
    runs-on: [self-hosted, linux, x64, n150, general]
    steps:
      - name: Update PI_MODEL repo variable
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"PI_MODEL\",\"value\":\"${MODEL}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/PI_MODEL"
          echo "PI_MODEL is now '${MODEL}'. Every Pi workflow's model default (see #118) reads this."
