name: Pi Issue Agent
run-name: 'Pi Issue #${{ github.event.issue.number || github.event.client_payload.issue_number }}'

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [pi_dispatch_issue]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-issue-${{ github.event.issue.number || github.event.client_payload.issue_number }}
  cancel-in-progress: true

jobs:
  pi:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING' && ((github.event_name == 'issues' && github.event.label.name == 'pi:ready') || github.event_name == 'repository_dispatch')
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      ISSUE: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
      REPO: ${{ github.repository }}
      PI_ISSUE: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
      PI_PHASE: implementation
      PI_BASH_TIMEOUT_SECONDS: '1800'

    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize Pi usage
        run: |
          echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"
          echo "PI_IMPLEMENTER_RESULT_FILE=$RUNNER_TEMP/pi-implementer-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Validate dispatched issue
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          issue_json="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE}")"
          jq -e '.state == "open" and (([.labels[].name] | index("pi:ready")) != null)' <<<"$issue_json" >/dev/null

      - name: Ensure workflow labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pi-issue-status.sh ensure

      - name: Mark issue running
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pi-issue-status.sh running

      - name: Create temporary issue worktree
        id: worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          rm -rf "$JOB_DIR"
          git fetch origin dev
          START_REF=origin/dev
          CHECKPOINT="pi/issue-${ISSUE}-checkpoint"
          if git ls-remote --exit-code origin "refs/heads/${CHECKPOINT}" >/dev/null; then
            git fetch origin "${CHECKPOINT}:refs/remotes/origin/${CHECKPOINT}"
            START_REF="refs/remotes/origin/${CHECKPOINT}"
            echo "Resuming issue #${ISSUE} from its checkpoint"
          elif git ls-remote --exit-code origin "refs/heads/pi/issue-${ISSUE}" >/dev/null; then
            git fetch origin "pi/issue-${ISSUE}:refs/remotes/origin/pi/issue-${ISSUE}"
            START_REF="refs/remotes/origin/pi/issue-${ISSUE}"
            echo "Resuming issue #${ISSUE} from its PR branch"
          fi
          git worktree prune
          git worktree add -B "pi/issue-${ISSUE}" "$JOB_DIR" "$START_REF"
          echo "Temporary worktree: $JOB_DIR"

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python --version
          sqlite3 --version
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"
          pytest --version
          ruff --version

      - name: Prepare issue task
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}")"
          ISSUE_TITLE="$(jq -r '.title' <<<"$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"$ISSUE_JSON")"

          TASK_FILE="${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/implementer/AGENTS.md before doing any work.

          You are implementing GitHub issue #${ISSUE_NUMBER} in the current repository.

          Issue title:
          ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Work directly in the checked-out repository.
          Implement the issue completely, keeping the change focused.
          Inspect existing code and tests before editing.
          Add or update unit tests for every behavior changed by this issue.
          Cover the acceptance criteria and important edge cases.
          Do not consider the implementation complete without appropriate automated tests.
          Run the relevant test suite and Ruff before finishing.
          Do not commit, push, create a pull request, or modify GitHub issue labels.
          Do not access production credentials or external social APIs.
          Finish only after the repository is in a state ready for CI.
          EOF

      - name: Run Pi with live progress
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          TASK_FILE="${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-implementer-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

          printf '\n'

      - name: Save implementation checkpoint
        id: checkpoint
        if: always() && steps.worktree.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -Ei '(^|/)(\.env(\.|$)|.*\.(db|sqlite3?|pem|key)$|credentials([^/]*$|/))' | grep -Ev '(^|/)\.env\.example$'; then
            echo "Refusing to checkpoint a credential or runtime file" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement issue #${ISSUE}"
          fi
          if git diff --quiet origin/dev...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/pi/issue-${ISSUE}-checkpoint"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh from dev and verify integrated code
        if: steps.checkpoint.outputs.changed == 'true'
        run: |
          cd "$JOB_DIR"
          git fetch origin dev
          if ! git merge --no-edit origin/dev; then
            echo "Merge with dev needs repair" >&2
            NEED_REPAIR=true
          else
            NEED_REPAIR=false
          fi
          if [ "$NEED_REPAIR" = false ]; then
            if ! git diff --check origin/dev...HEAD > "$RUNNER_TEMP/pi-issue-whitespace.log" 2>&1; then NEED_REPAIR=true; fi
            python -m pip install -e .
            if ! pytest > "$RUNNER_TEMP/pi-issue-pytest.log" 2>&1; then NEED_REPAIR=true; fi
            if ! ruff check . > "$RUNNER_TEMP/pi-issue-ruff.log" 2>&1; then NEED_REPAIR=true; fi
            cat "$RUNNER_TEMP/pi-issue-whitespace.log" "$RUNNER_TEMP/pi-issue-pytest.log" "$RUNNER_TEMP/pi-issue-ruff.log"
          fi
          if [ "$NEED_REPAIR" = false ]; then exit 0; fi
          if [ "$NEED_REPAIR" = true ]; then
            echo "One Pi repair attempt for integration, whitespace or test failures"
            set -o pipefail
            pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
              "Read agents/implementer/AGENTS.md. Resolve the current merge conflict, whitespace errors or failing tests in this worktree for issue #${ISSUE}. Do not commit, push or change GitHub state. Fix only these problems, then run git diff --check origin/dev...HEAD, pytest and ruff check . before finishing. Existing logs: $RUNNER_TEMP/pi-issue-whitespace.log, $RUNNER_TEMP/pi-issue-pytest.log and $RUNNER_TEMP/pi-issue-ruff.log (read them if present)." \
              | PI_CALL=integration node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved merge conflicts remain" >&2
              exit 1
            fi
            git add -A
            if git diff --cached --name-only | grep -Ei '(^|/)(\.env(\.|$)|.*\.(db|sqlite3?|pem|key)$|credentials([^/]*$|/))' | grep -Ev '(^|/)\.env\.example$'; then
              echo "Refusing to commit a credential or runtime file" >&2
              exit 1
            fi
            if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
              git commit --no-edit
            elif ! git diff --cached --quiet; then
              git commit -m "fix: resolve integration for issue #${ISSUE}"
            fi
          fi
          python -m pip install -e .
          pytest
          ruff check .
          git diff --check origin/dev...HEAD

      - name: Save verified or failed integration checkpoint
        if: always() && steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Keeping the previous checkpoint; unresolved conflict cannot be committed" >&2
            exit 0
          fi
          git add -A
          if git diff --cached --name-only | grep -Ei '(^|/)(\.env(\.|$)|.*\.(db|sqlite3?|pem|key)$|credentials([^/]*$|/))' | grep -Ev '(^|/)\.env\.example$'; then
            echo "Refusing to checkpoint a credential or runtime file" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve integration for issue #${ISSUE}"
          fi
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/pi/issue-${ISSUE}-checkpoint"

      - name: Push verified issue branch
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git fetch origin dev
          git merge-base --is-ancestor origin/dev HEAD || {
            echo "dev moved during verification; checkpoint preserved for retry" >&2
            exit 1
          }
          git diff --check origin/dev...HEAD
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --set-upstream origin "HEAD:refs/heads/pi/issue-${ISSUE}"

      - name: Create or update pull request
        id: pr
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          EXISTING="$(
            curl -fsS "${AUTH[@]}"               "${API}/pulls?state=open&head=${OWNER}%3Api%2Fissue-${ISSUE}&base=dev"
          )"

          PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$EXISTING")"
          PR_URL="$(jq -r '.[0].html_url // empty' <<<"$EXISTING")"

          RESULT_FILE="${PI_IMPLEMENTER_RESULT_FILE}"
          if [ ! -s "$RESULT_FILE" ]; then
            echo "Implementer PR metadata missing; using issue-based fallback"
            jq -n --arg title "Pi: #${ISSUE} ${ISSUE_TITLE}" --arg summary "Implements issue #${ISSUE}." \
              '{title:$title,summary:$summary,changes:[],security_notes:"",limitations:""}' > "$RESULT_FILE"
          fi
          TITLE="$(jq -r '.title' "$RESULT_FILE")"
          SUMMARY="$(jq -r '.summary' "$RESULT_FILE")"
          CHANGES="$(jq -r 'if (.changes // []) | length > 0 then (.changes | map("- " + .) | join("\n")) else "- See the diff for implementation details." end' "$RESULT_FILE")"
          SECURITY="$(jq -r '.security_notes // ""' "$RESULT_FILE")"
          LIMITATIONS="$(jq -r '.limitations // ""' "$RESULT_FILE")"
          TESTS="- pytest: passed\n- ruff check .: passed\n- git diff --check origin/dev...HEAD: passed"
          BODY="$(printf '## Summary\n%s\n\n## Changes\n%b\n\n## Security\n%s\n\n## Validation\n%b\n\n## Known limitations\n%s\n\nCloses #%s\n' "$SUMMARY" "$CHANGES" "${SECURITY:-No special security impact identified.}" "$TESTS" "${LIMITATIONS:-None identified.}" "$ISSUE")"

          if [ -z "$PR_NUMBER" ]; then
            PR_JSON="$(jq -n --arg title "$TITLE" --arg head "pi/issue-${ISSUE}" --arg base "dev" --arg body "$BODY" '{title:$title,head:$head,base:$base,body:$body}' | curl -fsS -X POST "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @- "${API}/pulls")"
            PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
            PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"
          else
            jq -n --arg title "$TITLE" --arg body "$BODY" '{title:$title,body:$body}' | curl -fsS -X PATCH "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @- "${API}/pulls/${PR_NUMBER}" >/dev/null
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Trigger Pi PR review
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          jq -n \
            --arg event_type "pi_pr_review" \
            --arg pr_number "${{ steps.pr.outputs.number }}" \
            '{event_type:$event_type,client_payload:{pr_number:$pr_number}}' |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "${API}/dispatches"

      - name: Mark pull request created
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-issue-status.sh mr-created             "Pi finished the implementation and opened/updated PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.url }}"

      - name: Remove published checkpoint
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin --delete "pi/issue-${ISSUE}-checkpoint"

      - name: Mark no-change result
        if: steps.checkpoint.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-issue-status.sh needs-human             "Pi completed the task but produced no repository changes. Human review is required."

      - name: Mark failed result
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MESSAGE="Pi workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          if git ls-remote --exit-code origin "refs/heads/pi/issue-${ISSUE}-checkpoint" >/dev/null; then
            MESSAGE="$MESSAGE Saved work: https://github.com/${REPO}/tree/pi/issue-${ISSUE}-checkpoint"
          fi
          bash scripts/pi-issue-status.sh failed "$MESSAGE"

      - name: Mark cancelled result
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-issue-status.sh cancelled             "Pi workflow was cancelled. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize Pi usage
        if: always()
        run: node scripts/pi-usage-summary.mjs

      - name: Clean temporary worktree
        if: always()
        run: |
          set +e
          JOB_DIR="${JOB_DIR:-$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          if [ -d "$JOB_DIR" ]; then
            git worktree remove --force "$JOB_DIR"
          fi
          rm -rf "$JOB_DIR"
          rm -f "${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          git worktree prune
          echo "Temporary worktree removed: $JOB_DIR"
