name: Pi Issue Agent
run-name: "🤖 Implement #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: number
      dispatch_mode:
        description: Dispatch mode
        required: true
        default: manual
        type: choice
        options:
          - manual
          - dispatcher
      backend:
        description: Agent backend (mini-swe is experimental/manual only)
        required: true
        default: pi
        type: choice
        options:
          - pi
          - mini-swe
      model:
        description: Model backend override; default reads .pi/default-model
        required: true
        default: default
        type: choice
        options:
          - default
          - laguna
          - qwen

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  pi:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      ISSUE: ${{ inputs.issue_number }}
      PI_MODEL_CHOICE: ${{ inputs.model || 'default' }}
      PI_STAGE_BACKEND: ${{ inputs.backend || 'pi' }}
      PI_DISPATCH_MODE: ${{ inputs.dispatch_mode || 'manual' }}

    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize implementation result
        run: |
          echo "PI_IMPLEMENTER_RESULT_FILE=$RUNNER_TEMP/pi-implementer-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"
          echo "PI_RUNTIME_FAILURE_FILE=$RUNNER_TEMP/pi-runtime-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"
          echo "PI_VALIDATION_LEDGER_FILE=$RUNNER_TEMP/pi-validation-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Validate and load dispatched issue
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_CONTEXT="$RUNNER_TEMP/pi-issue-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          MODE="plain"
          if [ "$PI_DISPATCH_MODE" = "dispatcher" ]; then MODE="ready"; fi
          node "$GITHUB_WORKSPACE/scripts/pi-common/issue-context.mjs" "$ISSUE" "$ISSUE_CONTEXT" "$MODE"
          echo "PI_ISSUE_CONTEXT=$ISSUE_CONTEXT" >> "$GITHUB_ENV"

      - name: Ensure workflow labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-labels.mjs" issue

      - name: Mark issue running
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTION="running-manual"
          if [ "$PI_DISPATCH_MODE" = "dispatcher" ]; then ACTION="running"; fi
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue "$ACTION"

      - name: Create temporary issue worktree
        id: worktree
        if: steps.claim.outputs.terminal != 'true'
        run: |
          JOB_DIR="$RUNNER_TEMP/agent-implementer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          CONTEXT="$(node "$GITHUB_WORKSPACE/scripts/pi-common/issue-worktree.mjs" prepare "$ISSUE" "$JOB_DIR" "$RUNNER_TEMP")"
          echo "PI_IMPLEMENTER_START_COMMIT=$(jq -r '.start' <<<"$CONTEXT")" >> "$GITHUB_ENV"
          echo "PI_CHECKPOINT_EXPECTED=$(jq -r '.checkpointExpected' <<<"$CONTEXT")" >> "$GITHUB_ENV"
          echo "PI_ISSUE_BRANCH_EXPECTED=$(jq -r '.issueBranchExpected' <<<"$CONTEXT")" >> "$GITHUB_ENV"
          echo "PI_RESUME_PATCH=$(jq -r '.patch' <<<"$CONTEXT")" >> "$GITHUB_ENV"
          echo "PI_RESUME_ACTIVE=$(jq -r '.resumed' <<<"$CONTEXT")" >> "$GITHUB_ENV"

      - name: Prepare Python environment
        if: steps.claim.outputs.terminal != 'true'
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/prepare-environment.mjs" implementer "$JOB_DIR"

      - name: Prepare Orbit Local code graph
        if: steps.claim.outputs.terminal != 'true' && env.PI_STAGE_BACKEND == 'pi'
        run: |
          command -v orbit >/dev/null
          orbit version
          cd "$RUNNER_TEMP"
          orbit setup pi --mcp --yes --no-index >/dev/null
          orbit index "$JOB_DIR" >/dev/null
          echo "Orbit Local MCP configured and current issue worktree indexed."

      - name: Run implementation backend with live progress
        if: steps.claim.outputs.terminal != 'true'
        run: |
          cd "$JOB_DIR"
          node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" implementer

      - name: Save implementation checkpoint
        id: checkpoint
        if: always() && steps.worktree.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(node "$GITHUB_WORKSPACE/scripts/pi-common/issue-publication.mjs" checkpoint "$ISSUE" "$JOB_DIR" "$PI_IMPLEMENTER_START_COMMIT" "$PI_CHECKPOINT_EXPECTED")"
          CHANGED="$(jq -r '.changed' <<<"$RESULT")"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "true" ]; then
            COMMIT="$(jq -r '.commit' <<<"$RESULT")"
            echo "PI_CHECKPOINT_EXPECTED=$COMMIT" >> "$GITHUB_ENV"
            echo "PI_CHECKPOINT_PUBLISHED=$COMMIT" >> "$GITHUB_ENV"
          fi

      - name: Push verified issue branch
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/issue-publication.mjs" push "$ISSUE" "$JOB_DIR" "$PI_IMPLEMENTER_START_COMMIT" "$PI_ISSUE_BRANCH_EXPECTED" "$PI_IMPLEMENTER_RESULT_FILE"

      - name: Create or update pull request
        id: pr
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The backend arg is the workflow_dispatch backend input directly, not
          # $PI_STAGE_BACKEND or any other shell-environment expansion: inputs.*
          # is fixed by the Actions runner at dispatch time and is never routed
          # through $GITHUB_ENV, so nothing a running job does (including a
          # compromised mini-swe process writing to $GITHUB_ENV) can alter it.
          PR="$(node "$GITHUB_WORKSPACE/scripts/pi-common/issue-publication.mjs" pr "$ISSUE" "$PI_IMPLEMENTER_RESULT_FILE" "${{ github.repository_owner }}" "$PI_VALIDATION_LEDGER_FILE" "${{ inputs.backend || 'pi' }}")"
          echo "number=$(jq -r '.number' <<<"$PR")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url' <<<"$PR")" >> "$GITHUB_OUTPUT"
          echo "verification_state=$(jq -r '.verification_state' <<<"$PR")" >> "$GITHUB_OUTPUT"

      - name: Mark pull request created
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created             "Pi finished the implementation and opened/updated PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.url }} (verification: ${{ steps.pr.outputs.verification_state }})"

      # Verification state is the ledger's, not prose: a PR whose authoritative
      # checks did not all complete already carries pi:needs-human (added by
      # issue-publication.mjs), which both the PR-guard (Reviewer/PR Fix) and
      # Merge Gate treat as a hard stop. Skipping the dispatch here too avoids
      # burning a Reviewer run that can only ever self-skip.
      - name: Start independent PR review
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != '' && steps.pr.outputs.verification_state == 'VERIFIED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/issue-publication.mjs" review "${{ steps.pr.outputs.number }}"

      - name: Remove published checkpoint
        if: steps.pr.outputs.number != '' && env.PI_CHECKPOINT_PUBLISHED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --force-with-lease="refs/heads/pi/issue-${ISSUE}-checkpoint:${PI_CHECKPOINT_PUBLISHED}" origin ":refs/heads/pi/issue-${ISSUE}-checkpoint"

      # This also handles a failed implementation backend with no repository changes:
      # checkpoint runs under always(), publishes changed=false, and routes the durable abort
      # provenance here while the job itself remains failed.
      - name: Mark no-change result
        if: always() && !cancelled() && steps.checkpoint.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME=unknown
          BLOCKED_REASON=""
          if [ -s "$PI_IMPLEMENTER_RESULT_FILE" ]; then
            OUTCOME="$(jq -r '.outcome // (if .blocked == true then "blocked" elif .already_satisfied == true then "already_satisfied" else "unknown" end)' "$PI_IMPLEMENTER_RESULT_FILE")"
            BLOCKED_REASON="$(jq -r '.blocked_reason // empty' "$PI_IMPLEMENTER_RESULT_FILE")"
          fi
          if [ "$OUTCOME" = "already_satisfied" ]; then
            node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue satisfied               "Pi verified that the exact requested end state already exists in latest dev; no duplicate change or PR is needed."
            exit 0
          fi
          if [ "$OUTCOME" = "blocked" ]; then
            node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human               "Implementation is blocked pending human clarification: $BLOCKED_REASON"
            exit 0
          fi
          if [ -s "$PI_RUNTIME_FAILURE_FILE" ]; then
            if jq -e '
              type == "object" and
              .schema_version == 1 and
              (.failure_class | type == "string") and
              (.failure_code | type == "string") and
              (.reason | type == "string") and
              .failure_class == "model_execution_abort" and
              .failure_code == "PI_ACTION_REQUIRED_ABORT"
            ' "$PI_RUNTIME_FAILURE_FILE" >/dev/null 2>&1; then
              FAILURE_CLASS="model_execution_abort"
              FAILURE_CODE="PI_ACTION_REQUIRED_ABORT"
              FAILURE_REASON="Implementer runtime aborted after repeated action-required responses without a usable tool action"
            else
              FAILURE_CLASS="execution_failure"
              FAILURE_CODE="runtime_failure_metadata_invalid"
              FAILURE_REASON="Runtime failure metadata was invalid; inspect the Actions log and model trace"
            fi
            node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human               "Pi execution aborted before terminal submission [$FAILURE_CLASS/$FAILURE_CODE]: $FAILURE_REASON"
            echo "::error::Implementation execution aborted [$FAILURE_CLASS/$FAILURE_CODE]: $FAILURE_REASON"
            exit 1
          fi
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human             "Pi completed the task but produced no repository changes. Human review is required."
          echo "::error::Implementation completed without repository changes."
          exit 1

      - name: Recover publication state after failure
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created \
            "Pi published PR #${{ steps.pr.outputs.number }} before a later workflow step failed: ${{ steps.pr.outputs.url }}. Merge Gate/reconciler will continue from the published PR."

      - name: Mark failed result
        if: failure() && steps.preflight.outcome == 'success' && steps.checkpoint.outputs.changed != 'false' && steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$PI_RUNTIME_FAILURE_FILE" ]; then
            if jq -e '
              type == "object" and
              .schema_version == 1 and
              (.failure_class | type == "string") and
              (.failure_code | type == "string") and
              (.reason | type == "string") and
              .failure_class == "model_execution_abort" and
              .failure_code == "PI_ACTION_REQUIRED_ABORT"
            ' "$PI_RUNTIME_FAILURE_FILE" >/dev/null 2>&1; then
              FAILURE_CLASS="model_execution_abort"
              FAILURE_CODE="PI_ACTION_REQUIRED_ABORT"
              FAILURE_REASON="Implementer runtime aborted after repeated action-required responses without a usable tool action"
            else
              FAILURE_CLASS="execution_failure"
              FAILURE_CODE="runtime_failure_metadata_invalid"
              FAILURE_REASON="Runtime failure metadata was invalid; inspect the Actions log and model trace"
            fi
            MESSAGE="Pi execution aborted before terminal submission [$FAILURE_CLASS/$FAILURE_CODE]: $FAILURE_REASON. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            MESSAGE="Pi workflow failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          if git ls-remote --exit-code origin "refs/heads/pi/issue-${ISSUE}-checkpoint" >/dev/null; then
            MESSAGE="$MESSAGE Saved work: https://github.com/${GITHUB_REPOSITORY}/tree/pi/issue-${ISSUE}-checkpoint"
          fi
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human "$MESSAGE"

      - name: Recover publication state after cancellation
        if: cancelled() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created \
            "Pi published PR #${{ steps.pr.outputs.number }} before the workflow was cancelled: ${{ steps.pr.outputs.url }}. Merge Gate/reconciler will continue from the published PR."

      - name: Mark cancelled result
        if: cancelled() && steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue stopped \
            "Pi implementation run was cancelled. Saved checkpoint work, if any, will be replayed from latest dev on the next dispatch."

      - name: Summarize issue pipeline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-issue-summary.mjs" "$ISSUE"

      - name: Summarize Pi usage
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/pi-usage-summary.mjs"

      - name: Upload model request and response trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-model-trace-implementer-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-model-trace-implementer-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: ignore
          retention-days: 1

      - name: Clean temporary worktree
        if: always()
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-common/issue-worktree.mjs" clean "${JOB_DIR:-}" "${PI_RESUME_PATCH:-}"
          echo "Temporary worktree removed: ${JOB_DIR:-}"
