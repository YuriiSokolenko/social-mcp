name: Pi Issue Agent
run-name: "🤖 Implement #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  pi:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      ISSUE: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      PI_ISSUE: ${{ inputs.issue_number }}
      PI_PHASE: implementation
      PI_BASH_TIMEOUT_SECONDS: '1800'

    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize Pi usage
        run: |
          echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"
          echo "PI_IMPLEMENTER_RESULT_FILE=$RUNNER_TEMP/pi-implementer-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Validate dispatched issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          issue_json="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE}")"
          jq -e '.state == "open" and (([.labels[].name] | index("pi:ready")) != null)' <<<"$issue_json" >/dev/null

      - name: Ensure workflow labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-labels.mjs" issue

      - name: Mark issue running
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue running

      - name: Create temporary issue worktree
        id: worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          rm -rf "$JOB_DIR"
          git fetch origin dev
          START_COMMIT="$(git rev-parse origin/dev)"
          CHECKPOINT="pi/issue-${ISSUE}-checkpoint"
          CHECKPOINT_REMOTE="$(git ls-remote origin "refs/heads/${CHECKPOINT}" | awk '{print $1}')"
          echo "PI_CHECKPOINT_EXPECTED=${CHECKPOINT_REMOTE}" >> "$GITHUB_ENV"
          ISSUE_BRANCH_REMOTE="$(git ls-remote origin "refs/heads/pi/issue-${ISSUE}" | awk '{print $1}')"
          echo "PI_ISSUE_BRANCH_EXPECTED=${ISSUE_BRANCH_REMOTE}" >> "$GITHUB_ENV"
          RESUME_REF=""
          if [ -n "$CHECKPOINT_REMOTE" ]; then
            git fetch origin "${CHECKPOINT}:refs/remotes/origin/${CHECKPOINT}"
            RESUME_REF="refs/remotes/origin/${CHECKPOINT}"
            echo "Replaying issue #${ISSUE} checkpoint onto latest dev"
          elif [ -n "$ISSUE_BRANCH_REMOTE" ]; then
            git fetch origin "pi/issue-${ISSUE}:refs/remotes/origin/pi/issue-${ISSUE}"
            RESUME_REF="refs/remotes/origin/pi/issue-${ISSUE}"
            echo "Replaying issue #${ISSUE} branch onto latest dev"
          fi
          echo "PI_IMPLEMENTER_START_COMMIT=${START_COMMIT}" >> "$GITHUB_ENV"
          git worktree prune
          git worktree add -B "pi/issue-${ISSUE}" "$JOB_DIR" origin/dev
          if [ -n "$RESUME_REF" ]; then
            BASE="$(git merge-base origin/dev "$RESUME_REF")"
            git diff --binary "$BASE" "$RESUME_REF" > "$RUNNER_TEMP/pi-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch"
            if [ -s "$RUNNER_TEMP/pi-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch" ]; then
              if ! git -C "$JOB_DIR" apply --3way "$RUNNER_TEMP/pi-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch"; then
                echo "Saved work does not apply cleanly to latest dev; leaving conflicts for the live Implementer session"
              fi
            fi
          fi
          echo "Temporary worktree from latest dev: $JOB_DIR"

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python --version
          sqlite3 --version
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"
          pytest --version
          ruff --version

      - name: Prepare issue task
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}")"
          ISSUE_TITLE="$(jq -r '.title' <<<"$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"$ISSUE_JSON")"
          printf 'PI_ISSUE_TITLE=%s\n' "$ISSUE_TITLE" >> "$GITHUB_ENV"

          TASK_FILE="${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/implementer/AGENTS.md before doing any work.

          You are implementing GitHub issue #${ISSUE_NUMBER} in the current repository.

          Issue title:
          ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Work directly in the checked-out repository.
          The checked-out worktree is always based on the latest dev branch. dev is the only development base; never switch to, compare against, or treat main as an alternative source tree.
          Implement the issue completely, keeping the change focused.
          Inspect existing code and tests before editing.
          If replayed checkpoint work left merge conflicts in the worktree, resolve those conflicts first against the current dev code; do not abandon current dev or inspect main as a replacement base.
          Add or update unit tests for every behavior changed by this issue.
          Cover the acceptance criteria and important edge cases.
          Do not consider the implementation complete without appropriate automated tests.
          Run the relevant test suite and Ruff before finishing.
          Your final submit_result call integrates the latest dev and reruns deterministic validation.
          If submit_result reports merge conflicts, resolve them in this same agent session, rerun relevant tests, and call submit_result again until it succeeds.
          Do not commit, push, create a pull request, or modify GitHub issue labels; trusted workflow tooling owns those Git operations.
          Do not access production credentials or external social APIs.
          Finish only after submit_result succeeds.
          EOF

      - name: Run Pi with live progress
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          TASK_FILE="${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-implementer-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

          printf '\n'

      - name: Save implementation checkpoint
        id: checkpoint
        if: (success() || cancelled()) && steps.worktree.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved replay conflicts remain; preserving the previous checkpoint instead of saving conflict markers"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          if git diff --cached --name-only | grep -Ei '(^|/)(\.env(\.|$)|.*\.(db|sqlite3?|pem|key)$|credentials([^/]*$|/))' | grep -Ev '(^|/)\.env\.example$'; then
            echo "Refusing to checkpoint a credential or runtime file" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement issue #${ISSUE}"
          fi
          if git diff --quiet "${PI_IMPLEMENTER_START_COMMIT}"...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checkpoint exactly what the implementer produced.
          START_BASE="${PI_IMPLEMENTER_START_COMMIT}"
          if git diff --name-only "$START_BASE"...HEAD | grep -q '^\.github/workflows/'; then
            echo "Implementer attempted to modify .github/workflows; refusing unsafe checkpoint" >&2
            exit 1
          fi
          CHECKPOINT_COMMIT="$(git rev-parse HEAD)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease="refs/heads/pi/issue-${ISSUE}-checkpoint:${PI_CHECKPOINT_EXPECTED}" origin "${CHECKPOINT_COMMIT}:refs/heads/pi/issue-${ISSUE}-checkpoint"
          echo "PI_CHECKPOINT_EXPECTED=${CHECKPOINT_COMMIT}" >> "$GITHUB_ENV"
          echo "PI_CHECKPOINT_PUBLISHED=${CHECKPOINT_COMMIT}" >> "$GITHUB_ENV"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify implementation before publication
        if: steps.checkpoint.outputs.changed == 'true'
        run: |
          cd "$JOB_DIR"
          python -m pip install -e .
          git diff --check
          pytest
          ruff check .

      - name: Push verified issue branch
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git diff --check
          ISSUE_COMMIT="$(git rev-parse HEAD)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease="refs/heads/pi/issue-${ISSUE}:${PI_ISSUE_BRANCH_EXPECTED}" --set-upstream origin "${ISSUE_COMMIT}:refs/heads/pi/issue-${ISSUE}"

      - name: Create or update pull request
        id: pr
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          ISSUE_TITLE: ${{ env.PI_ISSUE_TITLE }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          EXISTING="$(
            curl -fsS "${AUTH[@]}"               "${API}/pulls?state=open&head=${OWNER}%3Api%2Fissue-${ISSUE}&base=dev"
          )"

          PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$EXISTING")"
          PR_URL="$(jq -r '.[0].html_url // empty' <<<"$EXISTING")"

          RESULT_FILE="${PI_IMPLEMENTER_RESULT_FILE}"
          if [ ! -s "$RESULT_FILE" ]; then
            echo "Implementer PR metadata missing; using issue-based fallback"
            jq -n --arg title "Pi: #${ISSUE} ${ISSUE_TITLE}" --arg summary "Implements issue #${ISSUE}." \
              '{title:$title,summary:$summary,changes:[],security_notes:"",limitations:""}' > "$RESULT_FILE"
          fi
          TITLE="$(jq -r '.title' "$RESULT_FILE")"
          SUMMARY="$(jq -r '.summary' "$RESULT_FILE")"
          CHANGES="$(jq -r 'if (.changes // []) | length > 0 then (.changes | map("- " + .) | join("\n")) else "- See the diff for implementation details." end' "$RESULT_FILE")"
          SECURITY="$(jq -r '.security_notes // ""' "$RESULT_FILE")"
          LIMITATIONS="$(jq -r '.limitations // ""' "$RESULT_FILE")"
          TESTS="- pytest: passed\n- ruff check .: passed\n- git diff --check: passed\n- The merged result is validated by the normal CI run on dev after merge."
          BODY="$(printf '## Summary\n%s\n\n## Changes\n%b\n\n## Security\n%s\n\n## Validation\n%b\n\n## Known limitations\n%s\n\nCloses #%s\n' "$SUMMARY" "$CHANGES" "${SECURITY:-No special security impact identified.}" "$TESTS" "${LIMITATIONS:-None identified.}" "$ISSUE")"

          if [ -z "$PR_NUMBER" ]; then
            PR_JSON="$(jq -n --arg title "$TITLE" --arg head "pi/issue-${ISSUE}" --arg base "dev" --arg body "$BODY" '{title:$title,head:$head,base:$base,body:$body}' | curl -fsS -X POST "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @- "${API}/pulls")"
            PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
            PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"
          else
            jq -n --arg title "$TITLE" --arg body "$BODY" '{title:$title,body:$body}' | curl -fsS -X PATCH "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @- "${API}/pulls/${PR_NUMBER}" >/dev/null
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Mark pull request created
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created             "Pi finished the implementation and opened/updated PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.url }}"

      - name: Start independent PR review
        if: steps.checkpoint.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"dev","inputs":{"pr_number":"${{ steps.pr.outputs.number }}"}}' \
            "${API}/actions/workflows/pi-pr-review.yml/dispatches"

      - name: Remove published checkpoint
        if: steps.pr.outputs.number != '' && env.PI_CHECKPOINT_PUBLISHED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --force-with-lease="refs/heads/pi/issue-${ISSUE}-checkpoint:${PI_CHECKPOINT_PUBLISHED}" origin ":refs/heads/pi/issue-${ISSUE}-checkpoint"

      - name: Mark no-change result
        if: steps.checkpoint.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human             "Pi completed the task but produced no repository changes. Human review is required."

      - name: Recover publication state after failure
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created \
            "Pi published PR #${{ steps.pr.outputs.number }} before a later workflow step failed: ${{ steps.pr.outputs.url }}. Merge Gate/reconciler will continue from the published PR."

      - name: Mark failed result
        if: failure() && steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MESSAGE="Pi workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          if git ls-remote --exit-code origin "refs/heads/pi/issue-${ISSUE}-checkpoint" >/dev/null; then
            MESSAGE="$MESSAGE Saved work: https://github.com/${REPO}/tree/pi/issue-${ISSUE}-checkpoint"
          fi
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human "$MESSAGE"

      - name: Recover publication state after cancellation
        if: cancelled() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue mr-created \
            "Pi published PR #${{ steps.pr.outputs.number }} before the workflow was cancelled: ${{ steps.pr.outputs.url }}. Merge Gate/reconciler will continue from the published PR."

      - name: Mark cancelled result
        if: cancelled() && steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue stopped \
            "Pi implementation run was cancelled. Saved checkpoint work, if any, will be replayed from latest dev on the next dispatch."

      - name: Summarize issue pipeline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-issue-summary.mjs" "$ISSUE"

      - name: Summarize Pi usage
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/pi-usage-summary.mjs"

      - name: Clean temporary worktree
        if: always()
        run: |
          set +e
          JOB_DIR="${JOB_DIR:-$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          if [ -d "$JOB_DIR" ]; then
            git worktree remove --force "$JOB_DIR"
          fi
          rm -rf "$JOB_DIR"
          rm -f "${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          rm -f "${RUNNER_TEMP}/pi-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch"
          git worktree prune
          echo "Temporary worktree removed: $JOB_DIR"