name: Pi Issue Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pi:
    if: github.event.label.name == 'pi:ready'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120

    steps:
      - name: Mark issue running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          curl -fsS -X DELETE "${AUTH[@]}"             "${API}/issues/${ISSUE}/labels/pi%3Aready" >/dev/null || true

          jq -n '{labels:["pi:running"]}' |             curl -fsS -X POST "${AUTH[@]}"               -H "Content-Type: application/json"               --data-binary @-               "${API}/issues/${ISSUE}/labels" >/dev/null

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create issue branch
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git checkout -B "pi/issue-${ISSUE}" origin/main

      - name: Run Pi with live progress
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail

          cat > /tmp/pi-task.txt <<EOF
          You are implementing GitHub issue #${ISSUE_NUMBER} in the current repository.

          Issue title:
          ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Work directly in the checked-out repository.
          Implement the issue completely, keeping the change focused.
          Inspect existing code and tests before editing.
          Add or update tests where appropriate.
          Do not commit, push, create a pull request, or modify GitHub issue labels.
          Do not access production credentials or external social APIs.
          Finish only after the repository is in a state ready for CI.
          EOF

          cat > /tmp/pi-log-filter.mjs <<'NODE'
          import readline from "node:readline";

          const rl = readline.createInterface({ input: process.stdin, crlfDelay: Infinity });
          let turnStartedAt = null;
          let lastUsage = null;

          const secretKey = /token|secret|authorization|api[_-]?key|password|credential|cookie/i;

          function redact(value, key = "") {
            if (secretKey.test(key)) return "[REDACTED]";
            if (Array.isArray(value)) return value.map((v) => redact(v));
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, redact(v, k)]));
            }
            if (typeof value === "string") {
              return value
                .replace(/Bearer\s+[^\s"']+/gi, "Bearer [REDACTED]")
                .replace(/(access_token|refresh_token|client_secret|api_key)=([^&\s]+)/gi, "$1=[REDACTED]");
            }
            return value;
          }

          function compact(value, limit = 6000) {
            let text;
            try {
              text = typeof value === "string" ? value : JSON.stringify(redact(value), null, 2);
            } catch {
              text = String(value);
            }
            if (text.length > limit) text = text.slice(0, limit) + `\n...[truncated ${text.length - limit} chars]`;
            return text;
          }

          function finalAssistantText(messages) {
            if (!Array.isArray(messages)) return "";
            const msg = [...messages].reverse().find((m) => m?.role === "assistant");
            if (!msg || !Array.isArray(msg.content)) return "";
            return msg.content.filter((c) => c?.type === "text").map((c) => c.text ?? "").join("");
          }

          for await (const line of rl) {
            if (!line.trim()) continue;
            let e;
            try { e = JSON.parse(line); } catch { console.log(`[pi] raw: ${line}`); continue; }

            if (e.usage) lastUsage = e.usage;

            switch (e.type) {
              case "session":
                console.log(`[pi] session started id=${e.id ?? "unknown"}`);
                break;
              case "agent_start":
                console.log("[pi] agent started");
                break;
              case "turn_start":
                turnStartedAt = Date.now();
                console.log("[pi] turn started");
                break;
              case "message_update": {
                const a = e.assistantMessageEvent ?? {};
                if (a.type === "text_delta") process.stdout.write(a.delta ?? "");
                else if (a.type === "toolcall_start") console.log(`\n[pi] preparing tool: ${a.toolName ?? "unknown"}`);
                break;
              }
              case "tool_execution_start":
                console.log(`\n[pi] tool start: ${e.toolName ?? "unknown"}`);
                console.log(`[pi] args:\n${compact(e.args)}`);
                break;
              case "tool_execution_end":
                console.log(`[pi] tool end: ${e.toolName ?? "unknown"} status=${e.isError ? "error" : "ok"}`);
                console.log(`[pi] result:\n${compact(e.result)}`);
                break;
              case "turn_end": {
                const seconds = turnStartedAt ? ((Date.now() - turnStartedAt) / 1000).toFixed(1) : "?";
                console.log(`\n[pi] turn finished duration=${seconds}s`);
                if (lastUsage) console.log(`[pi] usage: ${compact(lastUsage, 2000)}`);
                turnStartedAt = null;
                break;
              }
              case "compaction_start":
                console.log("[pi] compaction started");
                break;
              case "compaction_end":
                console.log("[pi] compaction finished");
                break;
              case "auto_retry_start":
                console.log(`[pi] retry started: ${compact(e, 2000)}`);
                break;
              case "auto_retry_end":
                console.log(`[pi] retry finished: ${compact(e, 2000)}`);
                break;
              case "extension_error":
                console.log(`[pi] extension error: ${compact(e, 3000)}`);
                break;
              case "agent_end": {
                console.log("[pi] agent finished");
                const final = finalAssistantText(e.messages);
                if (final) console.log(`[pi] final response:\n${compact(final, 12000)}`);
                if (lastUsage) console.log(`[pi] final usage: ${compact(lastUsage, 2000)}`);
                break;
              }
            }
          }
          NODE

          pi \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat /tmp/pi-task.txt)" \
          | node /tmp/pi-log-filter.mjs

          printf '\n'
      - name: Commit and push changes
        id: changes
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"

          git add -A
          git commit -m "feat: implement issue #${ISSUE}"
          git push --set-upstream origin "pi/issue-${ISSUE}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          PR_JSON="$(
            jq -n               --arg title "Pi: #${ISSUE} ${ISSUE_TITLE}"               --arg head "pi/issue-${ISSUE}"               --arg base "main"               --arg body "Closes #${ISSUE}\n\nImplemented automatically by the N150 Pi runner."               '{title:$title,head:$head,base:$base,body:$body}' |             curl -fsS -X POST "${AUTH[@]}"               -H "Content-Type: application/json"               --data-binary @-               "${API}/pulls"
          )"

          PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
          PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"

          curl -fsS -X DELETE "${AUTH[@]}"             "${API}/issues/${ISSUE}/labels/pi%3Arunning" >/dev/null || true

          jq -n '{labels:["pi:mr-created"]}' |             curl -fsS -X POST "${AUTH[@]}"               -H "Content-Type: application/json"               --data-binary @-               "${API}/issues/${ISSUE}/labels" >/dev/null

          jq -n --arg body "Pi finished the implementation and opened PR #${PR_NUMBER}: ${PR_URL}"             '{body:$body}' |             curl -fsS -X POST "${AUTH[@]}"               -H "Content-Type: application/json"               --data-binary @-               "${API}/issues/${ISSUE}/comments" >/dev/null

      - name: Mark no-change result
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          jq -n --arg body "Pi completed the task but produced no repository changes. Human review is required."             '{body:$body}' |             curl -fsS -X POST "${AUTH[@]}"               -H "Content-Type: application/json"               --data-binary @-               "${API}/issues/${ISSUE}/comments" >/dev/null
