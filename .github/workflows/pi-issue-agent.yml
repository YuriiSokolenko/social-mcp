name: Pi Issue Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pi:
    if: github.event.label.name == 'pi:ready'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      ISSUE: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure workflow labels
        run: bash scripts/pi-issue-status.sh ensure

      - name: Mark issue running
        run: bash scripts/pi-issue-status.sh running

      - name: Create temporary issue worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          rm -rf "$JOB_DIR"
          git fetch origin main
          git worktree prune
          git worktree add -B "pi/issue-${ISSUE}" "$JOB_DIR" origin/main
          echo "Temporary worktree: $JOB_DIR"

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python --version
          sqlite3 --version
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"
          pytest --version
          ruff --version

      - name: Run Pi with live progress
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          cd "$JOB_DIR"

          TASK_FILE="${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          cat > "$TASK_FILE" <<EOF
          You are implementing GitHub issue #${ISSUE_NUMBER} in the current repository.

          Issue title:
          ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Work directly in the checked-out repository.
          Implement the issue completely, keeping the change focused.
          Inspect existing code and tests before editing.
          Add or update tests where appropriate.
          Run relevant tests and Ruff before finishing.
          Do not commit, push, create a pull request, or modify GitHub issue labels.
          Do not access production credentials or external social APIs.
          Finish only after the repository is in a state ready for CI.
          EOF

          pi \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | node scripts/pi-log-filter.mjs

          printf '\n'

      - name: Commit and push changes
        id: changes
        run: |
          cd "$JOB_DIR"

          # Never let local execution artifacts become part of the agent commit.
          rm -rf             .venv             .pytest_cache             .ruff_cache             htmlcov             build             dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"

          git add -A
          git commit -m "feat: implement issue #${ISSUE}"
          git push --force-with-lease --set-upstream origin "pi/issue-${ISSUE}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OWNER: ${{ github.repository_owner }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          EXISTING="$(
            curl -fsS "${AUTH[@]}"               "${API}/pulls?state=open&head=${OWNER}%3Api%2Fissue-${ISSUE}&base=main"
          )"

          PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$EXISTING")"
          PR_URL="$(jq -r '.[0].html_url // empty' <<<"$EXISTING")"

          if [ -z "$PR_NUMBER" ]; then
            PR_JSON="$(
              jq -n                 --arg title "Pi: #${ISSUE} ${ISSUE_TITLE}"                 --arg head "pi/issue-${ISSUE}"                 --arg base "main"                 --arg body "Closes #${ISSUE}\n\nImplemented automatically by the N150 Pi runner."                 '{title:$title,head:$head,base:$base,body:$body}' |               curl -fsS -X POST "${AUTH[@]}"                 -H "Content-Type: application/json"                 --data-binary @-                 "${API}/pulls"
            )"

            PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
            PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Mark pull request created
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.number != ''
        run: |
          bash scripts/pi-issue-status.sh mr-created             "Pi finished the implementation and opened/updated PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.url }}"

      - name: Mark no-change result
        if: steps.changes.outputs.changed == 'false'
        run: |
          bash scripts/pi-issue-status.sh needs-human             "Pi completed the task but produced no repository changes. Human review is required."

      - name: Mark failed result
        if: failure()
        run: |
          bash scripts/pi-issue-status.sh failed             "Pi workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark cancelled result
        if: cancelled()
        run: |
          bash scripts/pi-issue-status.sh cancelled             "Pi workflow was cancelled. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Clean temporary worktree
        if: always()
        run: |
          set +e
          JOB_DIR="${JOB_DIR:-$RUNNER_TEMP/social-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          if [ -d "$JOB_DIR" ]; then
            git worktree remove --force "$JOB_DIR"
          fi
          rm -rf "$JOB_DIR"
          rm -f "${RUNNER_TEMP}/pi-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          git worktree prune
          echo "Temporary worktree removed: $JOB_DIR"
