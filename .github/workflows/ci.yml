name: CI
run-name: "🧪 CI · ${{ github.event.head_commit.message || github.ref_name }}"

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  # PR updates share one group, so a newer synchronize cancels stale queued/in-progress CI.
  # Pushes to dev stay SHA-scoped because each merged commit must complete post-merge handling.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.sha) }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Pull-request checkout is the synthetic merge commit. The acceptance
          # probes need its first parent as the trusted base for deletion checks.
          fetch-depth: 2

      - name: Create Python venv
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install project and development dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install -e . pytest pytest-asyncio ruff==0.12.12 "PyYAML>=6,<7"

      - name: Ruff
        run: ruff check --config "$GITHUB_WORKSPACE/pyproject.toml" .

      - name: Pytest
        run: pytest

      - name: Install the Pi runtime TypeBox contract dependency
        # Mirrors dependencies.typebox in @earendil-works/pi-coding-agent.
        run: npm install --prefix "$RUNNER_TEMP/pi-typebox-contract" --no-save --no-package-lock typebox@1.3.27

      - name: Validate the registered submit_result schema with real TypeBox
        env:
          PI_TYPEBOX_PACKAGE_ROOT: ${{ runner.temp }}/pi-typebox-contract
        run: node --test tests/ci/pi-implementer-typebox-schema-contract.test.mjs

      - name: Agent workflow checks
        run: node --test tests/*.test.mjs

      - name: Runner autoscaler checks
        run: bash tests/test_runner_autoscaler.sh

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: social-mcp-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up BuildKit
        run: |
          if ! docker buildx version >/dev/null 2>&1; then
            version=0.37.1
            package="docker-buildx-plugin_${version}-1~ubuntu.24.04~noble_amd64.deb"
            url="https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/${package}"
            curl -fsSL "$url" -o "/tmp/$package"
            echo '3c398af6eea280ddb57f32334d83867efd2bf07c4bc1be75fbd0a61c490ea925  /tmp/'"$package" | sha256sum --check --status
            sudo apt-get install --yes "/tmp/$package"
          fi
          docker buildx version
          docker buildx inspect
          docker system df || echo "::warning::Optional Docker disk diagnostics failed; inspect host metadata"
          docker buildx du || echo "::warning::Optional BuildKit cache diagnostics failed"
          id runner

      - name: Build runner manager and smoke-test run-check imports
        shell: bash
        run: |
          image="${COMPOSE_PROJECT_NAME}-manager-import-check:latest"
          worker_image="${COMPOSE_PROJECT_NAME}-general-worker-check:latest"
          pi_worker_image="${COMPOSE_PROJECT_NAME}-pi-worker-check:latest"
          trap 'docker image rm "$image" "$worker_image" "$pi_worker_image" >/dev/null 2>&1 || true' EXIT
          docker build -f infra/github-runner-autoscaler/manager.Dockerfile -t "$image" .
          docker run --rm --entrypoint node "$image" -e "import('/opt/social-mcp/scripts/pi-common/run-check.mjs').then(() => console.log('run-check import ok'))"
          docker build -f infra/github-runner-autoscaler/worker-general.Dockerfile -t "$worker_image" .
          docker run --rm --entrypoint bash "$worker_image" -lc '
            set -euo pipefail
            test "$(id -u runner)" = 1001
            test "$(./bin/Runner.Listener --version)" = 2.338.0
            python3 --version
            python3 -c "import sys; assert sys.version_info >= (3, 12), sys.version"
            python_temp="$(mktemp -d)"
            python3 -m venv "$python_temp/venv"
            "$python_temp/venv/bin/python" --version
            test "$(gh --version | head -n 1)" = "gh version 2.102.0 (2026-09-30)"
            gh variable set --help >/dev/null
            docker --version
            docker buildx version
            docker compose version
            sudo -n true
          '
          docker build -f infra/github-runner-autoscaler/worker.Dockerfile -t "$pi_worker_image" .
          docker run --rm --entrypoint bash "$pi_worker_image" -lc '
            set -euo pipefail
            test "$(id -u runner)" = 1001
            test "$(./bin/Runner.Listener --version)" = 2.338.0
            test "$(pi --version)" = "1.0.4"
            orbit version
            ast-grep --version
            basedpyright --version
            mini --help >/dev/null
            test -x "$(command -v kotlin-lsp)"
            sudo -n true
          '
          docker run --rm --entrypoint node "$pi_worker_image" --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import fs from "node:fs";
            const root = execFileSync("npm", ["root", "-g"], { encoding: "utf8" }).trim();
            fs.accessSync(root + "/lsp-mcp-server/dist/index.js");
            const extensionRoot = "/opt/pi-package-seed/npm/node_modules";
            for (const [name, version] of [["pi-mcp-adapter", "5.1.0"], ["pi-subagents", "0.76.1"]]) {
              const metadata = JSON.parse(fs.readFileSync(`${extensionRoot}/${name}/package.json`, "utf8"));
              if (metadata.version !== version) throw new Error(`${name} version mismatch: ${metadata.version}`);
            }
          '

      - name: Control runner capability and graceful-stop smoke
        shell: bash
        run: |
          set -euo pipefail
          base_image="${COMPOSE_PROJECT_NAME}-control-runner-check:latest"
          fixture_image="${COMPOSE_PROJECT_NAME}-control-runner-stop-check:latest"
          container="${COMPOSE_PROJECT_NAME}-control-runner-stop-check"
          fixture="$RUNNER_TEMP/control-runner-stop-check"
          rm -rf "$fixture"
          mkdir -p "$fixture/control-test/bin"

          cat > "$fixture/control-test/bin/Runner.Listener" <<'LISTENER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "--version" ]; then
            printf '2.337.0\n'
            exit 0
          fi
          [ "${1:-}" = "run" ] || exit 2
          id -u > "$RUNNER_HOME/ready"
          trap 'id -u > "$RUNNER_HOME/stopped"; exit 0' INT TERM
          while true; do sleep 1; done
          LISTENER
          chmod +x "$fixture/control-test/bin/Runner.Listener"
          printf '#!/usr/bin/env bash\nexit 99\n' > "$fixture/control-test/config.sh"
          chmod +x "$fixture/control-test/config.sh"
          printf 'registered\n' > "$fixture/control-test/.runner"
          printf 'credentials\n' > "$fixture/control-test/.credentials"

          cat > "$fixture/Dockerfile" <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY --chown=runner:runner control-test/ /control-test/
          DOCKERFILE

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker image rm "$fixture_image" "$base_image" >/dev/null 2>&1 || true
            rm -rf "$fixture"
          }
          trap cleanup EXIT

          docker build -f infra/github-runner-autoscaler/control-runner.Dockerfile -t "$base_image" .
          docker run --rm --entrypoint bash "$base_image" -lc '
            set -euo pipefail
            git --version >/dev/null
            node_version="$(node --version)"
            case "$node_version" in
              v24.*) ;;
              *) echo "unexpected Node.js version: $node_version" >&2; exit 1 ;;
            esac
            test "$(./bin/Runner.Listener --version)" = "2.337.0"
          '
          docker build --build-arg "BASE_IMAGE=$base_image" -t "$fixture_image" "$fixture"

          docker run -d --name "$container" \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETUID \
            --cap-add KILL \
            --security-opt no-new-privileges \
            --cpus 1 \
            --memory 1g \
            --pids-limit 512 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e GH_ADMIN_TOKEN=dummy \
            -e GITHUB_REPOSITORY=example/repo \
            -e RUNNER_HOME=/control-test \
            "$fixture_image" >/dev/null

          for _ in {1..100}; do
            docker exec "$container" test -f /control-test/ready >/dev/null 2>&1 && break
            sleep 0.1
          done
          docker exec "$container" test -f /control-test/ready >/dev/null 2>&1 || {
            docker logs "$container" >&2 || true
            echo 'control runner listener did not start' >&2
            exit 1
          }

          listener_uid="$(docker exec "$container" cat /control-test/ready)"
          [ "$listener_uid" = "1001" ] || {
            echo "control runner listener uid is $listener_uid, expected 1001" >&2
            exit 1
          }

          started_at="$(date +%s)"
          docker stop --time 5 "$container" >/dev/null
          elapsed="$(( $(date +%s) - started_at ))"

          docker cp "$container:/control-test/stopped" "$fixture/stopped" >/dev/null 2>&1 || {
            docker logs "$container" >&2 || true
            echo 'uid 1001 listener did not receive the graceful-stop signal' >&2
            exit 1
          }
          stopped_uid="$(cat "$fixture/stopped")"
          [ "$stopped_uid" = "1001" ] || {
            echo "graceful-stop marker uid is $stopped_uid, expected 1001" >&2
            exit 1
          }

          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          [ "$exit_code" -eq 0 ] || {
            echo "control runner exited with code $exit_code instead of 0" >&2
            exit 1
          }
          [ "$elapsed" -lt 10 ] || {
            echo "control runner graceful stop took too long: ${elapsed}s" >&2
            exit 1
          }

      - name: Generate ephemeral test encryption key
        shell: bash
        run: |
          key="$(head -c32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n')"
          test "${#key}" -eq 44
          [[ "$key" == *= ]]
          echo "TOKEN_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and start isolated Compose environment
        run: docker compose up --build --wait

      - name: Smoke test built image
        shell: bash
        run: |
          image_id="$(docker compose images -q app)"
          test -n "$image_id"
          docker image inspect "$image_id" > /dev/null

          port="$(docker compose port app 8000 | awk -F: '{print $NF}')"
          echo "CI_BASE_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"

      - name: Integration tests against the running container
        run: python3 tests/test_ci_container.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans



  wake-merge-gate:
    if: >-
      always() &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) &&
      github.ref == 'refs/heads/dev' &&
      needs.test.result == 'success' &&
      needs.docker.result == 'success'
    needs: [test, docker]
    # Dedicated persistent control-plane lane; intentionally not n150/general.
    runs-on: [self-hosted, n150, control]
    timeout-minutes: 2
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Finalize merged issue after green dev CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-post-merge.mjs "$GITHUB_SHA"

      - name: Continue merge queue after green dev CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-common/workflow-dispatch.mjs pi-auto-merge.yml
