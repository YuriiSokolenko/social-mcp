name: CI
run-name: "🧪 CI · ${{ github.event.head_commit.message || github.ref_name }}"

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Keep the Actions pip cache as a fallback until the host bind mount is
      # deployed and verified on the general runner pool.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development dependencies
        run: |
          python3 --version
          python3 -m pip --version
          python3 -m venv .venv
          .venv/bin/python -m pip install -e . pytest pytest-asyncio ruff==0.12.12 "PyYAML>=6,<7"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff
        run: .venv/bin/ruff check --config "$GITHUB_WORKSPACE/pyproject.toml" .

      - name: Pytest
        run: .venv/bin/pytest

      - name: Agent workflow checks
        run: node --test tests/*.test.mjs

      - name: Runner autoscaler checks
        run: bash tests/test_runner_autoscaler.sh

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: social-mcp-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up BuildKit
        run: |
          if ! docker buildx version >/dev/null 2>&1; then
            version=0.37.1
            package="docker-buildx-plugin_${version}-1~ubuntu.24.04~noble_amd64.deb"
            url="https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/${package}"
            curl -fsSL "$url" -o "/tmp/$package"
            echo '3c398af6eea280ddb57f32334d83867efd2bf07c4bc1be75fbd0a61c490ea925  /tmp/'"$package" | sha256sum --check --status
            sudo apt-get install --yes "/tmp/$package"
          fi
          docker buildx version
          docker buildx inspect
          docker system df
          docker buildx du
          id runner

      - name: Generate ephemeral test encryption key
        shell: bash
        run: |
          key="$(head -c32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n')"
          test "${#key}" -eq 44
          [[ "$key" == *= ]]
          echo "TOKEN_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and start isolated Compose environment
        run: docker compose up --build --wait

      - name: Smoke test built image
        shell: bash
        run: |
          image_id="$(docker compose images -q app)"
          test -n "$image_id"
          docker image inspect "$image_id" > /dev/null

          port="$(docker compose port app 8000 | awk -F: '{print $NF}')"
          echo "CI_BASE_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"

      - name: Integration tests against the running container
        run: python3 tests/test_ci_container.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans



  wake-merge-gate:
    if: >-
      always() &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) &&
      github.ref == 'refs/heads/dev' &&
      needs.test.result == 'success' &&
      needs.docker.result == 'success'
    needs: [test, docker]
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 2
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Finalize merged issue after green dev CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-post-merge.mjs "$GITHUB_SHA"

      - name: Continue merge queue after green dev CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-common/workflow-dispatch.mjs pi-auto-merge.yml
