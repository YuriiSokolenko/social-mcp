name: CI
run-name: "🧪 CI · ${{ github.event.pull_request.title || inputs.pr_title || github.event.head_commit.message || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number associated with this CI run
        required: false
        type: string
      pr_title:
        description: Pull request title for the Actions run name
        required: false
        type: string
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pi-auto-merge.mjs always dispatches a workflow_dispatch CI run for pi/issue-*
    # branches, so skip the redundant pull_request-triggered run for those branches
    # instead of letting the concurrency group cancel it (which shows as a failure).
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'pi/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: pip install -e . pytest pytest-asyncio ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Agent workflow checks
        run: node --test tests/*.test.mjs

      - name: Runner autoscaler checks
        run: bash tests/test_runner_autoscaler.sh

  docker:
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'pi/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: social-mcp-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate ephemeral test encryption key
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.fernet import Fernet
          print(f"TOKEN_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          PY

      - name: Build and start isolated Compose environment
        run: docker compose up --build --wait

      - name: Smoke test built image
        shell: bash
        run: |
          image_id="$(docker compose images -q app)"
          test -n "$image_id"
          docker image inspect "$image_id" > /dev/null

          port="$(docker compose port app 8000 | awk -F: '{print $NF}')"
          echo "CI_BASE_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"

      - name: Integration tests against the running container
        run: python tests/test_ci_container.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans
