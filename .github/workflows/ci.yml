name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: pip install -e . pytest pytest-asyncio ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Merge agent gates
        run: node --test tests/pi-auto-merge.test.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ephemeral test encryption key
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.fernet import Fernet
          print(f"TOKEN_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          PY

      - name: Build and start isolated Compose environment
        run: docker compose up --build --wait

      - name: Smoke test built image
        shell: bash
        run: |
          image_id="$(docker compose images -q app)"
          test -n "$image_id"
          docker image inspect "$image_id" > /dev/null

          port="$(docker compose port app 8000 | awk -F: '{print $NF}')"
          base_url="http://127.0.0.1:${port}"
          curl --fail --silent --show-error --retry 5 --retry-delay 1 "$base_url/health" |
            python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent --show-error "$base_url/openapi.json" |
            python -c 'import json, sys; spec = json.load(sys.stdin); assert spec["info"]["title"] == "Social MCP"; assert "/health" in spec["paths"]'

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans
