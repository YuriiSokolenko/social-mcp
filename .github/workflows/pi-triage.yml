name: Pi Triage
run-name: "🔎 Triage · ${{ github.event.issue.title || 'queue scan' }}"

on:
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: pi-triage
  cancel-in-progress: false

jobs:
  triage:
    # Manual runs always triage. Issue-close events only wake triage when an
    # ordinary issue (not a PR) closed; prepare remains the source of truth
    # and will exit without invoking Pi when no candidates exist.
    if: vars.PI_AUTOMATION_MODE == 'RUNNING' && (github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      REPO: ${{ github.repository }}
      PI_TRIAGE_BATCH_SIZE: '8'

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Prepare triage context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-triage.mjs" prepare "$RUNNER_TEMP/pi-triage-context.json"
          if jq -e '(.candidates | length > 0)' "$RUNNER_TEMP/pi-triage-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi triage
        if: steps.prepare.outputs.run == 'true'
        run: |
          TASK_FILE="$RUNNER_TEMP/pi-triage-task.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/triage/AGENTS.md. Do not read docs/PROJECT_CONTEXT.md unless one specific candidate genuinely requires product context to resolve an ambiguity.
          The candidate issues to review are at $RUNNER_TEMP/pi-triage-context.json.
          The snapshot contains current issue body, Task metadata, labels, dependency states, and relevant comments.
          Classify every candidate exactly once as ready for Dispatcher, needing a person, or skipped. Do not reconsider a decided candidate.
          Call submit_result exactly once as your last action. Do not modify repository or GitHub state.
          EOF
          node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" triage --prompt-file "$TASK_FILE" --raw "$RUNNER_TEMP/pi-triage-result.jsonl"

      - name: Validate and apply triage decisions
        if: vars.PI_AUTOMATION_MODE == 'RUNNING' && steps.prepare.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-triage.mjs" apply "$RUNNER_TEMP/pi-triage-result.jsonl"
