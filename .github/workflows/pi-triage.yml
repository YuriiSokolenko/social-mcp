name: Pi Triage
run-name: "🔎 Triage · ${{ github.event.issue.title || 'queue scan' }}"

on:
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: pi-triage
  cancel-in-progress: false

jobs:
  triage:
    # Manual runs always triage. Issue-close events only wake triage when an
    # ordinary issue (not a PR) closed; prepare remains the source of truth
    # and will exit without invoking Pi when no candidates exist.
    if: vars.PI_AUTOMATION_MODE == 'RUNNING' && (github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      REPO: ${{ github.repository }}
      PI_BASH_TIMEOUT_SECONDS: '600'
      PI_TRIAGE_BATCH_SIZE: '8'
      PI_REQUIRED_FIRST_READ_PATH: 'agents/triage/AGENTS.md'

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl" >> "$GITHUB_ENV"

      - name: Prepare triage context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-triage.mjs" prepare "$RUNNER_TEMP/pi-triage-context.json"
          if jq -e '(.candidates | length > 0)' "$RUNNER_TEMP/pi-triage-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi triage
        if: steps.prepare.outputs.run == 'true'
        run: |
          set -o pipefail
          TASK_FILE="$RUNNER_TEMP/pi-triage-task.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/triage/AGENTS.md. Do not read docs/PROJECT_CONTEXT.md unless one specific candidate genuinely requires product context to resolve an ambiguity.
          The candidate issues to review are at $RUNNER_TEMP/pi-triage-context.json.
          The snapshot contains the current GitHub issue body, Task metadata, labels, dependency states, and relevant comments for every candidate.
          Classify every candidate exactly once as ready for the dispatcher, needing a person, or skipped, per your role rules. Previous workflow failures and pipeline labels are not unresolved product decisions by themselves. Do not reconsider a decided candidate; move directly to the next one.
          Call submit_result exactly once, as your last action, with your classification.
          Do not modify the repository or GitHub state.
          EOF
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-response-budget.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-loop-guard.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-triage-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RUNNER_TEMP/pi-triage-result.jsonl" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

      - name: Validate and apply triage decisions
        if: steps.prepare.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-triage.mjs" apply "$RUNNER_TEMP/pi-triage-result.jsonl"
