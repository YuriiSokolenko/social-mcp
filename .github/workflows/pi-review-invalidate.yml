name: PR Review Invalidate
run-name: "♻️ Invalidate review · PR #${{ github.event.pull_request.number }}"

on:
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-review-invalidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalidate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'pi/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Invalidate stale review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" invalidate "$PR"
