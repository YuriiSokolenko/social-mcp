name: Pi Architect
run-name: "🏗 Architect #${{ inputs.issue_number }} · ${{ inputs.issue_title || 'title unavailable' }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to review, refine, or split into dependency-linked tasks
        required: true
        type: number
      issue_title:
        description: Automatically resolved from the GitHub issue by the launcher
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: pi-architect
  queue: max
  cancel-in-progress: false

jobs:
  architect:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
      PI_ISSUE: ${{ inputs.issue_number }}
      PI_PHASE: architect
      PI_BASH_TIMEOUT_SECONDS: '600'
      PI_MAX_TURNS: '100'
      PI_MAX_REPEAT_CALLS: '3'

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Load parent issue and queue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pi-architect.mjs prepare "$ISSUE" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Ask Pi Architect
        run: |
          set -o pipefail
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-loop-guard.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-architect-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "Read and follow agents/architect/AGENTS.md and docs/PROJECT_CONTEXT.md. The source issue and current queue are in $RUNNER_TEMP/pi-architect-context.json. Read that file and only the relevant existing code and tasks needed to decide. Do not keep re-checking evidence once the decision is clear. Call submit_result exactly once, as your last action, with the complete decision and concise rationale. Do not edit files or change GitHub state." \
            | tee "$RUNNER_TEMP/pi-architect-result.jsonl" \
            | PI_CALL=main node scripts/pi-log-filter.mjs

      - name: Validate and publish child tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pi-architect.mjs publish "$ISSUE" "$RUNNER_TEMP/pi-architect-result.jsonl" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Summarize Pi usage
        if: always()
        run: node scripts/pi-usage-summary.mjs