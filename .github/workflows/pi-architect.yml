name: Pi Architect
run-name: "🏗 Architect #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to review, refine, or split into dependency-linked tasks
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: pi-architect
  cancel-in-progress: false

jobs:
  architect:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
      PI_ISSUE: ${{ inputs.issue_number }}
      PI_PHASE: architect
      PI_BASH_TIMEOUT_SECONDS: '600'
      PI_MAX_TURNS: '100'
      PI_MAX_REPEAT_CALLS: '3'

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Load parent issue and queue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-architect.mjs" prepare "$ISSUE" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Ask Pi Architect
        run: |
          set -o pipefail
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-response-budget.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-loop-guard.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-architect-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "Read and follow agents/architect/AGENTS.md. The source issue, metadata, open issues and current queue are in $RUNNER_TEMP/pi-architect-context.json. Start from that prepared context. Inspect code, related work, project docs or skills only when needed to answer a concrete KEEP/REVISE/SPLIT question. Size or complexity alone is not a reason to split. Stop exploring once the decision is justified. Call submit_result exactly once as your final action. Do not edit files or change GitHub state." \
            | tee "$RUNNER_TEMP/pi-architect-result.jsonl" \
            | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

      - name: Validate and publish child tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-architect.mjs" publish "$ISSUE" "$RUNNER_TEMP/pi-architect-result.jsonl" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Mark Architect failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human \
            "Pi Architect workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark Architect cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue stopped \
            "Pi Architect run was cancelled. Returned to Dispatcher without automatic redispatch."

      - name: Summarize Pi usage
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/pi-usage-summary.mjs"