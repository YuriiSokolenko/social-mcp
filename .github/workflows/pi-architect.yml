name: Pi Architect
run-name: "🏗 Architect #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to review, refine, or split into dependency-linked tasks
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: pi-architect
  cancel-in-progress: false

jobs:
  architect:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Load parent issue and queue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-architect.mjs" prepare "$ISSUE" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Ask Pi Architect
        run: node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" architect --raw "$RUNNER_TEMP/pi-architect-result.jsonl"

      - name: Validate and publish child tasks
        if: vars.PI_AUTOMATION_MODE == 'RUNNING'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-architect.mjs" publish "$ISSUE" "$RUNNER_TEMP/pi-architect-result.jsonl" "$RUNNER_TEMP/pi-architect-context.json"

      - name: Mark Architect failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue needs-human \
            "Pi Architect workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark Architect cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-transition.mjs" issue stopped \
            "Pi Architect run was cancelled. Returned to Dispatcher without automatic redispatch."

      - name: Summarize Pi usage
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/pi-usage-summary.mjs"