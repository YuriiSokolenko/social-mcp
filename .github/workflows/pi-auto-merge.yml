name: Pi Auto Merge
run-name: "🔀 Merge gate · ${{ github.event.workflow_run.display_title || 'manual scan' }}"

on:
  workflow_run:
    workflows: [CI, Pi PR Review]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: pi-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Evaluate Pi pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pi-auto-merge.mjs

      - name: Summarize active Pi issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for issue in $(node scripts/pi-active-issues.mjs); do
            node scripts/pi-issue-summary.mjs "$issue"
          done
