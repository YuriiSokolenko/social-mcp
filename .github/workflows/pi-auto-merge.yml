name: Pi Auto Merge
run-name: "🔀 Merge gate · scan"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-auto-merge
  queue: max
  cancel-in-progress: false

jobs:
  merge:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Evaluate Pi pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-auto-merge.mjs"

      - name: Summarize active Pi issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for issue in $(node "$GITHUB_WORKSPACE/scripts/pi-active-issues.mjs"); do
            node "$GITHUB_WORKSPACE/scripts/pi-issue-summary.mjs" "$issue"
          done
