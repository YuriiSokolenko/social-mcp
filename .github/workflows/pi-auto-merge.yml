name: Pi Auto Merge
run-name: "🔀 Merge gate · scan"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Evaluate Pi pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-auto-merge.mjs"
