name: Pi Model Switch
run-name: "🔀 Switch model → ${{ inputs.model }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to load on nano (stops whichever one is currently running first)
        required: true
        type: choice
        options:
          - laguna
          - qwen

permissions:
  actions: write

concurrency:
  group: pi-model-switch
  cancel-in-progress: false

jobs:
  switch:
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 90
    steps:
      # Talks to nano over SSH using a dedicated key that is restricted, via
      # a forced command in its authorized_keys entry, to running exactly
      # infra/llama-gguf-experimental/switch-model.sh -- it cannot run
      # arbitrary commands on nano even if this secret ever leaked. See
      # docs/pi-model-switch-setup.md for how that key is installed; it is
      # NOT generated by this workflow.
      - name: Switch model on nano
        env:
          SSH_KEY: ${{ secrets.NANO_MODEL_SWITCH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secrets.NANO_MODEL_SWITCH_KEY is not set -- see docs/pi-model-switch-setup.md" >&2
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/nano-model-switch-key"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          KNOWN_HOSTS="$RUNNER_TEMP/nano-known-hosts"
          echo "192.168.8.210 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAb4bZegNWyL4Qzg5UkjWv6/tiTd00Za2J2wWx23i5IC" > "$KNOWN_HOSTS"

          ssh -i "$KEY_FILE" \
              -o UserKnownHostsFile="$KNOWN_HOSTS" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              yurasik@192.168.8.210 "${{ inputs.model }}"

      - name: Update default model for automatic Pi runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set PI_MODEL --body "${{ inputs.model }}" --repo "${{ github.repository }}"
          echo "nano is now serving '${{ inputs.model }}'; automatic Pi runs (dispatcher/triage) will use it by default."
