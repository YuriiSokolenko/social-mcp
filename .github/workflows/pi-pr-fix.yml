name: Pi PR Fix
run-name: "🔧 Fix PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: number
      model:
        description: Model backend override; default reads .pi/default-model
        required: true
        default: default
        type: choice
        options:
          - default
          - laguna
          - qwen

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-pr-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      PR: ${{ inputs.pr_number }}
      PI_MODEL_CHOICE: ${{ inputs.model || 'default' }}
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load and guard PR
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTEXT="$RUNNER_TEMP/pi-pr-context.json"
          node "$GITHUB_WORKSPACE/scripts/pi-common/pr-guard.mjs" "$PR" "$CONTEXT"
          echo "skip=$(jq -r '.skip' "$CONTEXT")" >> "$GITHUB_OUTPUT"
          echo "ISSUE=$(jq -r '.issue' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_REF=$(jq -r '.branch' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(jq -r '.head' "$CONTEXT")" >> "$GITHUB_ENV"

      - name: Create PR worktree
        if: steps.load.outputs.skip != 'true'
        run: |
          JOB_DIR="$RUNNER_TEMP/agent-repair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add -B "$HEAD_REF" "$JOB_DIR" "$HEAD_SHA"

      - name: Prepare latest dev and issue context
        if: steps.load.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          ISSUE_CONTEXT="$RUNNER_TEMP/pi-repair-issue-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
          node "$GITHUB_WORKSPACE/scripts/pi-common/issue-context.mjs" "$ISSUE" "$ISSUE_CONTEXT" plain
          echo "ISSUE_CONTEXT=$ISSUE_CONTEXT" >> "$GITHUB_ENV"
          node --input-type=module -e 'const { integrateLatestDev } = await import(process.argv[1]); const result = integrateLatestDev({ allowConflicts: true, conflictMessage: files => files.join(", ") }); if (result.conflicts.length) console.log("Preflight merge conflicts: " + result.conflicts.join(", ")); else console.log("Latest dev integrated.");' "$GITHUB_WORKSPACE/scripts/pi-common/finalize-product-tree.mjs"

      - name: Prepare environment
        if: steps.load.outputs.skip != 'true'
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/prepare-environment.mjs" repair "$JOB_DIR"

      - name: Run repair agent
        if: steps.load.outputs.skip != 'true'
        run: |
          cd "$JOB_DIR"
          node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" repair

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-diagnostics-repair-${{ inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-diagnostics-repair-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and publish repair
        id: publish
        if: steps.load.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(node "$GITHUB_WORKSPACE/scripts/pi-common/repair-publication.mjs" publish "$PR" "$ISSUE" "$JOB_DIR" "$HEAD_REF" "$HEAD_SHA")"
          echo "published=$(jq -r '.published' <<<"$RESULT")" >> "$GITHUB_OUTPUT"
          echo "needs_review=$(jq -r '.needsReview // false' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Start fresh review
        if: steps.publish.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/repair-publication.mjs" review "$PR"
