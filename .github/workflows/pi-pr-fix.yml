name: Pi PR Fix
run-name: "🔧 Repair PR #${{ inputs.pr_number }} ${{ inputs.pr_title && format('· {0}', inputs.pr_title) || '' }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: string
      pr_title:
        description: Automatically resolved from the GitHub pull request by the launcher
        required: false
        type: string
      reason:
        description: Why this repair was requested
        required: false
        type: choice
        options:
          - review
          - conflict
        default: review

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-pr-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      REASON: ${{ inputs.reason || 'review' }}
      PI_PHASE: repair
      PI_BASH_TIMEOUT_SECONDS: '1200'
      PI_REPAIR_INITIAL_EDIT_TIMEOUT_SECONDS: '3600'
      PI_REPAIR_MODEL_IDLE_TIMEOUT_SECONDS: '300'
      PI_REPAIR_STALL_TIMEOUT_SECONDS: '1800'
      PI_REPAIR_WATCHDOG_POLL_SECONDS: '30'
    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Load PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          PR_JSON="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/pulls/${PR}")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$BASE_REF" == "dev" ]]
          [[ "$HEAD_REF" == pi/issue-* ]]
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "PI_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

          LABELS="$(jq -r '[.labels[].name] | join(" ")' <<<"$PR_JSON")"
          if [ "$REASON" = "review" ] && ! grep -qw "review:changes-requested" <<<"$LABELS"; then
            echo "PR #${PR} no longer requests review repair; duplicate dispatch exits without model work."
            exit 0
          fi

      - name: Load review feedback
        if: env.REASON != 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          COMMENTS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/issues/${PR}/comments?per_page=100")"
          FEEDBACK="$(jq -r '[.[] | select(.user.login == "github-actions[bot]") | select((.body // "" | split("\n") | any(.[]; test("^[[:blank:]]*(?:#{1,6}[[:blank:]]+)?REVIEW_RESULT: CHANGES_REQUESTED[[:blank:]]*$"))))] | last | .body // empty' <<<"$COMMENTS")"
          [ -n "$FEEDBACK" ]
          printf '%s\n' "$FEEDBACK" > "$RUNNER_TEMP/review-feedback.txt"

      - name: Create PR worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          REPAIR_CHECKPOINT="pi/repair-pr-${PR}-checkpoint"
          CHECKPOINT_REMOTE="$(git ls-remote origin "refs/heads/${REPAIR_CHECKPOINT}" | awk '{print $1}')"
          echo "REPAIR_CHECKPOINT_EXPECTED=${CHECKPOINT_REMOTE}" >> "$GITHUB_ENV"
          if [ -n "$CHECKPOINT_REMOTE" ]; then
            git fetch origin "${REPAIR_CHECKPOINT}:refs/remotes/origin/${REPAIR_CHECKPOINT}"
            START_REF="refs/remotes/origin/${REPAIR_CHECKPOINT}"
          else
            git fetch origin "$HEAD_REF"
            START_REF="$HEAD_SHA"
          fi
          git worktree prune
          git worktree add -B "$HEAD_REF" "$JOB_DIR" "$START_REF"

      - name: Rebase branch onto latest dev
        if: env.REASON == 'conflict'
        id: rebase
        run: |
          cd "$JOB_DIR"
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git fetch origin dev
          set +e
          GIT_EDITOR=true git rebase origin/dev
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicted-files.txt"
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Pi repair with live progress
        if: env.REASON != 'conflict'
        run: |
          set -o pipefail
          cd "$JOB_DIR"

          progress_signature() {
            {
              git status --porcelain=v1 --untracked-files=all
              git diff --no-ext-diff --binary
              git diff --cached --no-ext-diff --binary
            } | git hash-object --stdin
          }

          initial_signature="$(progress_signature)"
          last_signature="$initial_signature"
          started_at="$(date +%s)"
          last_progress_at="$started_at"
          watchdog_reason_file="$RUNNER_TEMP/pi-repair-watchdog-reason.txt"
          activity_file="$RUNNER_TEMP/pi-repair-activity.jsonl"
          : > "$activity_file"
          rm -f "$watchdog_reason_file"

          (
            while true; do
              sleep "$PI_REPAIR_WATCHDOG_POLL_SECONDS"
              now="$(date +%s)"
              signature="$(progress_signature)"
              if [ "$signature" != "$last_signature" ]; then
                last_signature="$signature"
                last_progress_at="$now"
              fi

              active_tool_started_at="$(jq -rs '[.[] | select(.kind == "tool_start")] | last | .at // 0' "$activity_file")"
              active_tool_ended_at="$(jq -rs '[.[] | select(.kind == "tool_end")] | last | .at // 0' "$activity_file")"
              last_model_delta_at="$(jq -rs '[.[] | select(.kind == "model_delta")] | last | .at // 0' "$activity_file")"
              model_is_live=false
              if [ "$last_model_delta_at" -gt 0 ] && [ $((now * 1000 - last_model_delta_at)) -lt $((PI_REPAIR_MODEL_IDLE_TIMEOUT_SECONDS * 1000)) ]; then
                model_is_live=true
              fi
              tool_is_active=false
              if [ "$active_tool_started_at" -gt "$active_tool_ended_at" ]; then
                tool_is_active=true
              fi

              if [ "$signature" = "$initial_signature" ] && [ $((now - started_at)) -ge "$PI_REPAIR_INITIAL_EDIT_TIMEOUT_SECONDS" ]; then
                if [ "$model_is_live" = true ] || [ "$tool_is_active" = true ]; then
                  continue
                fi
                printf 'Repair agent made no worktree change within %ss and has no live model/tool activity; stopping likely research loop.\n' "$PI_REPAIR_INITIAL_EDIT_TIMEOUT_SECONDS" > "$watchdog_reason_file"
                kill -TERM "$PPID" 2>/dev/null || true
                exit 0
              fi

              if [ "$signature" != "$initial_signature" ] && [ $((now - last_progress_at)) -ge "$PI_REPAIR_STALL_TIMEOUT_SECONDS" ]; then
                if [ "$model_is_live" = true ] || [ "$tool_is_active" = true ]; then
                  continue
                fi
                printf 'Repair worktree stopped changing for %ss with no live model/tool activity; stopping stalled agent.\n' "$PI_REPAIR_STALL_TIMEOUT_SECONDS" > "$watchdog_reason_file"
                kill -TERM "$PPID" 2>/dev/null || true
                exit 0
              fi
            done
          ) &
          watchdog_pid=$!

          set +e
          PI_ACTIVITY_FILE="$activity_file" pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
            "Read and follow agents/repair/AGENTS.md. You are repairing PR #${PR} for issue #${ISSUE}. Address the blocking reviewer feedback below in the existing working tree. Do not commit, push, or modify GitHub state yourself.

          Reviewer feedback:

          $(cat "$RUNNER_TEMP/review-feedback.txt")" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          pi_status=${PIPESTATUS[0]}
          set -e

          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          if [ -s "$watchdog_reason_file" ]; then
            cat "$watchdog_reason_file" >&2
            exit 124
          fi
          [ "$pi_status" -eq 0 ] || exit "$pi_status"
          printf '\n'

      - name: Run Pi conflict resolution
        if: env.REASON == 'conflict' && steps.rebase.outputs.conflicted == 'true'
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
            "Read and follow agents/implementer/AGENTS.md. You are rebasing PR #${PR} for issue #${ISSUE} onto the latest origin/dev to resolve an actual integration conflict. The rebase left unresolved Git conflicts in these files:

          $(cat "$RUNNER_TEMP/conflicted-files.txt")

          Open each file and resolve every conflict marker so the result compiles and preserves the intent of both this PR's own change and the incoming dev change; do not discard either side wholesale. Stage the resolved files with git add, then continue the rebase with GIT_EDITOR=true git rebase --continue. If another rebase conflict appears, resolve it the same way and continue until the rebase completes. Then run the relevant tests and Ruff. Do not push or modify GitHub state yourself." \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          printf '\n'

      - name: Verify repair
        run: |
          cd "$JOB_DIR"
          if git grep -Il '^<<<<<<< ' -- . > /dev/null 2>&1; then
            echo "Unresolved conflict markers remain" >&2
            exit 1
          fi
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "Rebase is still in progress" >&2
            exit 1
          fi
          if [ "$REASON" = "conflict" ]; then
            git merge-base --is-ancestor origin/dev HEAD
            git diff --check origin/dev...HEAD
          else
            git diff --check
          fi
          pytest
          ruff check .

      - name: Save repair checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflict cannot be checkpointed safely" >&2
            exit 0
          fi
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "fix: checkpoint repair for PR #${PR}"; fi
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then exit 0; fi
          # Preserve the exact repair state. Do not manufacture a new parent
          # from latest dev; integration validity is established by Merge Gate CI.
          CHECKPOINT_COMMIT="$(git rev-parse HEAD)"
          CHECKPOINT_REF="refs/heads/pi/repair-pr-${PR}-checkpoint"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --force-with-lease="${CHECKPOINT_REF}:${REPAIR_CHECKPOINT_EXPECTED}" origin "${CHECKPOINT_COMMIT}:${CHECKPOINT_REF}"
          echo "REPAIR_CHECKPOINT_PUBLISHED=${CHECKPOINT_COMMIT}" >> "$GITHUB_ENV"

      - name: Commit and push repair
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$REASON" = "conflict" ]; then
              git commit -m "fix: integrate latest dev for issue #${ISSUE}"
            else
              git commit -m "fix: address review for issue #${ISSUE}"
            fi
          fi
          NEW_HEAD="$(git rev-parse HEAD)"
          if [ "$NEW_HEAD" = "$HEAD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_REMOTE="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          [ "$CURRENT_REMOTE" = "$HEAD_SHA" ] || { echo "PR head moved during repair; refusing stale push" >&2; exit 1; }
          if [ "$REASON" = "conflict" ]; then
            git fetch origin dev
            git merge-base --is-ancestor origin/dev HEAD || {
              echo "dev moved again during conflict resolution; Merge Gate will retry against the new dev" >&2
            }
          fi
          git diff --check
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/$HEAD_REF:$HEAD_SHA origin "HEAD:refs/heads/$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Remove published repair checkpoint
        if: steps.changes.outputs.changed == 'true' && (env.REPAIR_CHECKPOINT_PUBLISHED != '' || env.REPAIR_CHECKPOINT_EXPECTED != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --force-with-lease="refs/heads/pi/repair-pr-${PR}-checkpoint:${REPAIR_CHECKPOINT_PUBLISHED:-$REPAIR_CHECKPOINT_EXPECTED}" origin ":refs/heads/pi/repair-pr-${PR}-checkpoint" || \
            echo "::warning::Published repair is safe, but checkpoint cleanup was skipped because the checkpoint changed."

      - name: Mark no-change repair terminal
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-pr-review-status.sh failed "Automated Pi repair completed without producing a repository change. The existing review findings remain unresolved and require human attention. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Wake merge gate
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" --data '{"ref":"dev"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-auto-merge.yml/dispatches" || {
              echo "::warning::Repair is already published for PR #${PR}, but Merge Gate wake failed; the gate/reconciler can recover it."
              exit 0
            }

      - name: Report repair failure
        if: failure() && steps.changes.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-pr-review-status.sh failed "Automated Pi repair (reason: ${REASON}) did not produce a mergeable, passing PR. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize Pi usage
        if: always()
        run: node scripts/pi-usage-summary.mjs

      - name: Clean worktree
        if: always()
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] && [ -d "$JOB_DIR" ] && git worktree remove --force "$JOB_DIR"
          rm -f "$RUNNER_TEMP/review-feedback.txt" "$RUNNER_TEMP/conflicted-files.txt"
          git worktree prune