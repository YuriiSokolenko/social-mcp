name: Pi PR Fix
run-name: "🔧 Fix PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-pr-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      PI_PHASE: repair
      PI_BASH_TIMEOUT_SECONDS: '1200'
      PI_REQUIRE_TASK_COMPLEXITY: '1'
      PI_PRE_COMPLEXITY_ALLOWED_TOOLS: 'read,bash'
      PI_MAX_REPEAT_CALLS: '3'
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load and guard PR
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTEXT="$RUNNER_TEMP/pi-pr-context.json"
          node "$GITHUB_WORKSPACE/scripts/pi-common/pr-guard.mjs" "$PR" "$CONTEXT"
          echo "skip=$(jq -r '.skip' "$CONTEXT")" >> "$GITHUB_OUTPUT"
          echo "ISSUE=$(jq -r '.issue' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_REF=$(jq -r '.branch' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(jq -r '.head' "$CONTEXT")" >> "$GITHUB_ENV"

      - name: Create PR worktree
        if: steps.load.outputs.skip != 'true'
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add -B "$HEAD_REF" "$JOB_DIR" "$HEAD_SHA"

      - name: Prepare latest dev and issue context
        if: steps.load.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          ISSUE_CONTEXT="$RUNNER_TEMP/pi-repair-issue-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
          node --input-type=module -e 'import fs from "node:fs"; const { githubClient } = await import(process.argv[1]); const issue = await githubClient().loadIssue(Number(process.env.ISSUE)); fs.writeFileSync(process.argv[2], "# Issue #" + issue.number + ": " + issue.title + "\\n\\n" + (issue.body ?? ""));' "$GITHUB_WORKSPACE/scripts/pi-common/github-api.mjs" "$ISSUE_CONTEXT"
          echo "ISSUE_CONTEXT=$ISSUE_CONTEXT" >> "$GITHUB_ENV"
          node --input-type=module -e 'const { integrateLatestDev } = await import(process.argv[1]); const result = integrateLatestDev({ allowConflicts: true, conflictMessage: files => files.join(", ") }); if (result.conflicts.length) console.log("Preflight merge conflicts: " + result.conflicts.join(", ")); else console.log("Latest dev integrated.");' "$GITHUB_WORKSPACE/scripts/pi-common/finalize-product-tree.mjs"

      - name: Prepare environment
        if: steps.load.outputs.skip != 'true'
        run: |
          cd "$JOB_DIR"
          python -m venv .venv
          . .venv/bin/activate
          pip install -e . pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run repair agent
        if: steps.load.outputs.skip != 'true'
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-response-budget.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-loop-guard.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-repair-result-tool.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session             "Read agents/repair/AGENTS.md, then read the complete original issue from ${ISSUE_CONTEXT}. Repair PR #${PR} for issue #${ISSUE}. The worktree was preflight-synced with current dev; if merge conflicts remain, resolve them first. Work only from the PR branch and current repository evidence. Make the smallest correct change. Finish by calling submit_repair; it integrates current dev and validates the final tree. If it reports merge conflicts or failing checks, resolve them in this same session and retry submit_repair until it succeeds. Do not push or modify GitHub state yourself."             | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

      - name: Verify and publish repair
        id: publish
        if: steps.load.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(node "$GITHUB_WORKSPACE/scripts/pi-common/repair-publication.mjs" publish "$PR" "$ISSUE" "$JOB_DIR" "$HEAD_REF" "$HEAD_SHA")"
          echo "published=$(jq -r '.published' <<<"$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Start fresh review
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/repair-publication.mjs" review "$PR"


