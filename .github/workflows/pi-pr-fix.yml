name: Pi PR Fix
run-name: "🔧 Repair PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: string
      reason:
        description: Why this repair was requested
        required: false
        type: choice
        options:
          - review
          - conflict
        default: review

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-pr-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      REASON: ${{ inputs.reason || 'review' }}
      PI_PHASE: repair
      PI_BASH_TIMEOUT_SECONDS: '1200'
    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Load PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          PR_JSON="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/pulls/${PR}")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$BASE_REF" == "dev" ]]
          [[ "$HEAD_REF" == pi/issue-* ]]
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "PI_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

      - name: Load review feedback
        if: env.REASON != 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          COMMENTS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/issues/${PR}/comments?per_page=100")"
          FEEDBACK="$(jq -r '[.[] | select(.user.login == "github-actions[bot]") | select((.body // "" | split("\n") | any(.[]; test("^[[:blank:]]*(?:#{1,6}[[:blank:]]+)?REVIEW_RESULT: CHANGES_REQUESTED[[:blank:]]*$"))))] | last | .body // empty' <<<"$COMMENTS")"
          [ -n "$FEEDBACK" ]
          printf '%s\n' "$FEEDBACK" > "$RUNNER_TEMP/review-feedback.txt"

      - name: Create PR worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          REPAIR_CHECKPOINT="pi/repair-pr-${PR}-checkpoint"
          if git ls-remote --exit-code origin "refs/heads/${REPAIR_CHECKPOINT}" >/dev/null; then
            git fetch origin "${REPAIR_CHECKPOINT}:refs/remotes/origin/${REPAIR_CHECKPOINT}"
            START_REF="refs/remotes/origin/${REPAIR_CHECKPOINT}"
          else
            git fetch origin "$HEAD_REF"
            START_REF="$HEAD_SHA"
          fi
          git worktree prune
          git worktree add -B "$HEAD_REF" "$JOB_DIR" "$START_REF"

      - name: Merge dev into branch
        if: env.REASON == 'conflict'
        id: merge
        run: |
          cd "$JOB_DIR"
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git fetch origin dev
          set +e
          git merge --no-edit origin/dev
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicted-files.txt"
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Pi repair with live progress
        if: env.REASON != 'conflict'
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
            "Read and follow agents/implementer/AGENTS.md. You are repairing PR #${PR} for issue #${ISSUE}. Work on the existing PR branch; do not discard existing implementation. Address every blocking item in this reviewer feedback, add/update tests, run relevant tests and Ruff, and keep changes focused. Do not commit, push, or modify GitHub state yourself.

          Reviewer feedback:

          $(cat "$RUNNER_TEMP/review-feedback.txt")" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          printf '\n'

      - name: Run Pi conflict resolution
        if: env.REASON == 'conflict' && steps.merge.outputs.conflicted == 'true'
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
            "Read and follow agents/implementer/AGENTS.md. You are resolving a merge of the latest dev into PR #${PR} for issue #${ISSUE}. Merging origin/dev left unresolved Git conflict markers in these files:

          $(cat "$RUNNER_TEMP/conflicted-files.txt")

          Open each file and resolve every conflict marker so the result compiles and preserves the intent of both this PR's own change and the incoming dev change; do not discard either side wholesale. Then run the relevant tests and Ruff. Do not commit, push, or modify GitHub state yourself." \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          printf '\n'

      - name: Verify repair
        run: |
          cd "$JOB_DIR"
          if git grep -Il '^<<<<<<< ' -- . > /dev/null 2>&1; then
            echo "Unresolved merge conflict markers remain" >&2
            exit 1
          fi
          pytest
          ruff check .

      - name: Save repair checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflict cannot be checkpointed safely" >&2
            exit 0
          fi
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "fix: checkpoint repair for PR #${PR}"; fi
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then exit 0; fi
          git fetch origin dev
          REPAIR_TREE="$(git rev-parse HEAD^{tree})"
          CHECKPOINT_COMMIT="$(printf 'fix: checkpoint repair for PR #%s\n' "$PR" | git commit-tree "$REPAIR_TREE" -p origin/dev)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force origin "${CHECKPOINT_COMMIT}:refs/heads/pi/repair-pr-${PR}-checkpoint"

      - name: Commit and push repair
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$JOB_DIR"
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$REASON" = "conflict" ]; then
              git commit -m "fix: merge dev and resolve conflicts for issue #${ISSUE}"
            else
              git commit -m "fix: address review for issue #${ISSUE}"
            fi
          fi
          NEW_HEAD="$(git rev-parse HEAD)"
          if [ "$NEW_HEAD" = "$HEAD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_REMOTE="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          [ "$CURRENT_REMOTE" = "$HEAD_SHA" ] || { echo "PR head moved during repair; refusing stale push" >&2; exit 1; }
          # Review repairs may run for hours while dev keeps moving. Integrate the
          # latest dev before re-rooting so the repaired tree cannot silently
          # revert unrelated changes that landed after this job started.
          git fetch origin dev
          if ! git merge --no-edit origin/dev; then
            echo "dev moved and now conflicts with the repaired PR; refusing to publish a stale tree" >&2
            exit 1
          fi
          REPAIR_TREE="$(git rev-parse HEAD^{tree})"
          REPAIR_COMMIT="$(printf 'fix: repair issue #%s\n' "$ISSUE" | git commit-tree "$REPAIR_TREE" -p origin/dev)"
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/$HEAD_REF:$HEAD_SHA origin "$REPAIR_COMMIT:refs/heads/$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Remove published repair checkpoint
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin --delete "pi/repair-pr-${PR}-checkpoint" 2>/dev/null || true

      - name: Wake merge gate
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" --data '{"ref":"dev"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-auto-merge.yml/dispatches"

      - name: Report repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-pr-review-status.sh failed "Automated Pi repair (reason: ${REASON}) did not produce a mergeable, passing PR. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize Pi usage
        if: always()
        run: node scripts/pi-usage-summary.mjs

      - name: Clean worktree
        if: always()
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] && [ -d "$JOB_DIR" ] && git worktree remove --force "$JOB_DIR"
          rm -f "$RUNNER_TEMP/review-feedback.txt" "$RUNNER_TEMP/conflicted-files.txt"
          git worktree prune
