name: Pi PR Fix
run-name: "🔧 Repair PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-pr-fix-${{ inputs.pr_number }}
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 1200
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      PI_PHASE: repair
      PI_BASH_TIMEOUT_SECONDS: '1200'
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load PR
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          [ "$(jq -r '.state' <<<"$PR_JSON")" = "open" ]
          [ "$(jq -r '.base.ref' <<<"$PR_JSON")" = "dev" ]
          [ "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$REPO" ]
          if jq -e '[.labels[].name] | index("pi:needs-human") != null' <<<"$PR_JSON" >/dev/null; then
            echo "PR #${PR} requires human attention; skipping automation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$HEAD_REF" == pi/issue-* ]]
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

      - name: Create PR worktree
        if: steps.load.outputs.skip != 'true'
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add -B "$HEAD_REF" "$JOB_DIR" "$HEAD_SHA"

      - name: Prepare environment
        if: steps.load.outputs.skip != 'true'
        run: |
          cd "$JOB_DIR"
          python -m venv .venv
          . .venv/bin/activate
          pip install -e . pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run repair agent
        if: steps.load.outputs.skip != 'true'
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-repair-result-tool.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session             "Read agents/repair/AGENTS.md. Repair PR #${PR} for issue #${ISSUE}. Work only from the PR branch and current repository evidence. Make the smallest correct change. Finish by calling submit_repair; it integrates current dev and validates the final tree. If it reports merge conflicts or failing checks, resolve them in this same session and retry submit_repair until it succeeds. Do not push or modify GitHub state yourself."             | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

      - name: Verify and publish repair
        id: publish
        if: steps.load.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          if jq -e '[.labels[].name] | index("pi:needs-human") != null' <<<"$PR_JSON" >/dev/null; then
            echo "PR #${PR} became human-gated during repair; refusing publication"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$JOB_DIR"
          git diff --check
          rm -rf .venv .pytest_cache .ruff_cache htmlcov build dist
          rm -f .coverage coverage.xml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "social-mcp-pi"
          git config user.email "social-mcp-pi@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No repair change produced"; exit 1; }
          git commit -m "fix: repair issue #${ISSUE}"
          CURRENT_REMOTE="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          [ "$CURRENT_REMOTE" = "$HEAD_SHA" ] || { echo "PR head moved; refusing stale push" >&2; exit 1; }
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/$HEAD_REF:$HEAD_SHA origin "HEAD:refs/heads/$HEAD_REF"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Start fresh review
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          LABELS="$(jq -c '[.labels[].name | select(startswith("review:") | not)]' <<<"$PR_JSON")"
          jq -n --argjson labels "$LABELS" '{labels:$labels}' | curl --retry 3 --fail-with-body -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @- "https://api.github.com/repos/${REPO}/issues/${PR}/labels" >/dev/null
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            --data '{"ref":"dev","inputs":{"pr_number":"'${PR}'"}}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-pr-review.yml/dispatches"

      - name: Clean worktree
        if: always()
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] && [ -d "$JOB_DIR" ] && git worktree remove --force "$JOB_DIR"
          git worktree prune
