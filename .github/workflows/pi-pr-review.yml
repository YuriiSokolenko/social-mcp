name: Pi PR Review

on:
  repository_dispatch:
    types: [pi_pr_review]
  pull_request:
    types: [reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pi-pr-review-${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'repository_dispatch' || github.event.action == 'reopened'
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 120
    env:
      PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Load pull request metadata
        run: |
          API="https://api.github.com/repos/${REPO}"
          PR_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/pulls/${PR}")"

          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"

          if [ "$DRAFT" = "true" ]; then
            echo "Pull request #${PR} is draft; skipping review." >&2
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Pull request #${PR} comes from another repository; refusing self-hosted review." >&2
            exit 1
          fi
          case "$HEAD_REF" in
            pi/issue-*) ;;
            *)
              echo "Pull request #${PR} head '$HEAD_REF' is not a pi/issue-* branch." >&2
              exit 1
              ;;
          esac

          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Ensure review labels
        run: bash scripts/pi-pr-review-status.sh ensure

      - name: Mark review running
        run: |
          bash scripts/pi-pr-review-status.sh running \
            "Automated Pi review started for \`${HEAD_SHA:0:12}\`."

      - name: Create temporary PR worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          rm -rf "$JOB_DIR"
          git fetch origin "$HEAD_REF"
          git worktree prune
          git worktree add --detach "$JOB_DIR" "$HEAD_SHA"
          echo "Temporary review worktree: $JOB_DIR"

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python --version
          sqlite3 --version
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run deterministic checks
        id: checks
        run: |
          cd "$JOB_DIR"
          set +e
          pytest > "$RUNNER_TEMP/pytest.log" 2>&1
          PYTEST_EXIT=$?
          ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
          RUFF_EXIT=$?
          set -e

          echo "pytest_exit=$PYTEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "ruff_exit=$RUFF_EXIT" >> "$GITHUB_OUTPUT"

          echo "=== pytest ==="
          cat "$RUNNER_TEMP/pytest.log"
          echo
          echo "=== ruff ==="
          cat "$RUNNER_TEMP/ruff.log"

      - name: Build review context
        env:
          PYTEST_EXIT: ${{ steps.checks.outputs.pytest_exit }}
          RUFF_EXIT: ${{ steps.checks.outputs.ruff_exit }}
        run: |
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

          API="https://api.github.com/repos/${REPO}"
          ISSUE_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/issues/${ISSUE}")"
          PR_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/pulls/${PR}")"

          ISSUE_TITLE="$(jq -r '.title // ""' <<<"$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"$ISSUE_JSON")"
          PR_TITLE="$(jq -r '.title // ""' <<<"$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"

          TASK_FILE="$RUNNER_TEMP/pi-review-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/reviewer/AGENTS.md before reviewing.
          
          You are reviewing pull request #${PR} against its linked GitHub issue #${ISSUE}.
          
          Do not modify files.
          Do not commit or push.
          Do not create or edit GitHub comments, reviews, labels, issues, or pull requests.
          Review only the checked-out code and local repository history/diff.
          
          Issue title:
          ${ISSUE_TITLE}
          
          Issue body:
          ${ISSUE_BODY}
          
          Pull request title:
          ${PR_TITLE}
          
          Pull request body:
          ${PR_BODY}
          
          Deterministic check exit codes:
          - pytest: ${PYTEST_EXIT}
          - ruff check .: ${RUFF_EXIT}
          
          The detailed pytest and Ruff logs are available at:
          - $RUNNER_TEMP/pytest.log
          - $RUNNER_TEMP/ruff.log
          
          Inspect the diff against origin/main and relevant surrounding code.
          
          Your final response MUST start with exactly one of:
          REVIEW_RESULT: PASS
          REVIEW_RESULT: CHANGES_REQUESTED
          EOF

          echo "TASK_FILE=$TASK_FILE" >> "$GITHUB_ENV"

      - name: Run Pi reviewer with live progress
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          RAW="$RUNNER_TEMP/pi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          echo "REVIEW_RAW=$RAW" >> "$GITHUB_ENV"

          pi \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RAW" \
          | node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

          printf '\n'

      - name: Parse review result
        id: result
        run: |
          RESULT_JSON="$(node scripts/pi-review-result.mjs "$REVIEW_RAW")"
          VERDICT="$(jq -r '.verdict' <<<"$RESULT_JSON")"
          jq -r '.text' <<<"$RESULT_JSON" > "$RUNNER_TEMP/pi-review-comment.txt"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Mark review passed
        if: steps.result.outputs.verdict == 'PASS'
        run: |
          COMMENT="$(cat "$RUNNER_TEMP/pi-review-comment.txt")"
          bash scripts/pi-pr-review-status.sh passed "$COMMENT"

      - name: Mark changes requested
        if: steps.result.outputs.verdict == 'CHANGES_REQUESTED'
        run: |
          COMMENT="$(cat "$RUNNER_TEMP/pi-review-comment.txt")"
          bash scripts/pi-pr-review-status.sh changes-requested "$COMMENT"

      - name: Mark review failed
        if: failure()
        run: |
          bash scripts/pi-pr-review-status.sh failed \
            "Automated Pi review workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Clean temporary review worktree
        if: always()
        run: |
          set +e
          JOB_DIR="${JOB_DIR:-$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          if [ -d "$JOB_DIR" ]; then
            git worktree remove --force "$JOB_DIR"
          fi
          rm -rf "$JOB_DIR"
          rm -f \
            "$RUNNER_TEMP/pytest.log" \
            "$RUNNER_TEMP/ruff.log" \
            "$RUNNER_TEMP/pi-review-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" \
            "$RUNNER_TEMP/pi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" \
            "$RUNNER_TEMP/pi-review-comment.txt"
          git worktree prune

  dispatcher:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: read
    concurrency:
      group: pi-dispatcher
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Prepare dispatcher context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pi-dispatcher.mjs prepare "$RUNNER_TEMP/pi-dispatcher-context.json"
          if jq -e '.slots > 0 and (.candidates | length > 0)' "$RUNNER_TEMP/pi-dispatcher-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi dispatcher
        if: steps.prepare.outputs.run == 'true'
        run: |
          set -o pipefail
          TASK_FILE="$RUNNER_TEMP/pi-dispatcher-task.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/dispatcher/AGENTS.md and docs/PROJECT_CONTEXT.md.
          The current GitHub issue and PR snapshot is at $RUNNER_TEMP/pi-dispatcher-context.json.
          Read the snapshot and relevant tasks/<issue-number>.md files.
          Select eligible candidates in priority order, up to the available slots.
          Return the exact DISPATCH_RESULT line specified by your role rules.
          Do not modify the repository or GitHub state.
          EOF
          pi \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RUNNER_TEMP/pi-dispatcher-result.jsonl" \
          | node scripts/pi-log-filter.mjs

      - name: Validate and start selected issues
        if: steps.prepare.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pi-dispatcher.mjs apply "$RUNNER_TEMP/pi-dispatcher-result.jsonl"
