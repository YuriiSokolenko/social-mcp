name: Pi PR Review
run-name: "🔬 Review PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pi-pr-review-${{ inputs.pr_number }}
  queue: max
  cancel-in-progress: false

jobs:
  review:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      PI_PHASE: review
      PI_BASH_TIMEOUT_SECONDS: '600'
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          [ "$(jq -r '.state' <<<"$PR_JSON")" = "open" ]
          [ "$(jq -r '.draft' <<<"$PR_JSON")" = "false" ]
          [ "$(jq -r '.base.ref' <<<"$PR_JSON")" = "dev" ]
          [ "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$REPO" ]
          if jq -e '[.labels[].name] | index("pi:needs-human") != null' <<<"$PR_JSON" >/dev/null; then
            echo "PR #${PR} requires human attention; skipping automation"
            exit 0
          fi
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$HEAD_REF" =~ ^pi/issue-[1-9][0-9]*$ ]]
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

      - name: Create review worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add --detach "$JOB_DIR" "$HEAD_SHA"

      - name: Prepare environment
        run: |
          cd "$JOB_DIR"
          python -m venv .venv
          . .venv/bin/activate
          pip install -e . pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run deterministic review checks
        run: |
          cd "$JOB_DIR"
          git diff --check
          pytest
          ruff check .

      - name: Run independent review
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          RAW="$RUNNER_TEMP/pi-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-reviewer-result-tool.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
            "Read agents/reviewer/AGENTS.md. Review PR #${PR} against issue #${ISSUE}. Do not modify files or GitHub state. The deterministic checks already passed. Do not depend on a captured dev SHA or pre-merge CI status. Call submit_result exactly once as your final action." \
            | tee "$RAW" | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          node "$GITHUB_WORKSPACE/scripts/pi-review-result.mjs" "$RAW" > "$RUNNER_TEMP/review-result.json"
          jq -r '.text' "$RUNNER_TEMP/review-result.json"

      - name: Apply review result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$RUNNER_TEMP/review-result.json"
          VERDICT="$(jq -r '.verdict' "$RESULT")"
          TEXT="$(jq -r '.text' "$RESULT")"
          API="https://api.github.com/repos/${REPO}"
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/pulls/${PR}")"
          CURRENT_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "PR changed during review; refusing stale verdict and scheduling a fresh review"
            echo "STALE_REVIEW=true" >> "$GITHUB_ENV"
            exit 0
          fi

          LABELS="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}/issues/${PR}/labels" | jq -c '[.[].name | select(startswith("review:") | not)]')"
          if [ "$VERDICT" = "PASS" ]; then
            LABELS="$(jq -c '. + ["review:passed"]' <<<"$LABELS")"
          else
            LABELS="$(jq -c '. + ["review:changes-requested"]' <<<"$LABELS")"
          fi
          jq -n --argjson labels "$LABELS" '{labels:$labels}' | curl --fail-with-body -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @- "${API}/issues/${PR}/labels" >/dev/null
          jq -n --arg body "$TEXT" '{body:$body}' | curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @- "${API}/issues/${PR}/comments" >/dev/null
          echo "VERDICT=$VERDICT" >> "$GITHUB_ENV"

      - name: Restart review after PR head changed
        if: env.STALE_REVIEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            --data '{"ref":"dev","inputs":{"pr_number":"'${PR}'"}}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-pr-review.yml/dispatches"

      - name: Start PR Fix after changes requested
        if: env.VERDICT == 'CHANGES_REQUESTED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            --data '{"ref":"dev","inputs":{"pr_number":"'${PR}'"}}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-pr-fix.yml/dispatches"

      - name: Wake merge gate after PASS
        if: env.VERDICT == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data '{"ref":"dev"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-auto-merge.yml/dispatches"

      - name: Clean worktree
        if: always()
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] && [ -d "$JOB_DIR" ] && git worktree remove --force "$JOB_DIR"
          git worktree prune
