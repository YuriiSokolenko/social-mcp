name: Pi PR Review
run-name: "🔬 Review PR #${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }} · ${{ github.event.pull_request.title || github.event.client_payload.pr_title || inputs.pr_title || 'pull request' }}"

on:
  repository_dispatch:
    types: [pi_pr_review]
  pull_request:
    types: [reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      pr_title:
        description: Pull request title for the Actions run name
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-pr-review-${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE) && (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event.action == 'reopened')
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      PI_PHASE: review
      PI_BASH_TIMEOUT_SECONDS: '600'

    steps:
      - name: Checkout dev control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Initialize Pi usage
        run: echo "PI_METRICS_FILE=$RUNNER_TEMP/pi-usage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" >> "$GITHUB_ENV"

      - name: Load pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          PR_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/pulls/${PR}")"

          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"

          if [ "$BASE_REF" != "dev" ]; then
            echo "Pull request #${PR} does not target dev; refusing self-hosted review." >&2
            exit 1
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "Pull request #${PR} is draft; skipping review." >&2
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Pull request #${PR} comes from another repository; refusing self-hosted review." >&2
            exit 1
          fi
          case "$HEAD_REF" in
            pi/issue-*) ;;
            *)
              echo "Pull request #${PR} head '$HEAD_REF' is not a pi/issue-* branch." >&2
              exit 1
              ;;
          esac

          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Ensure review labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pi-pr-review-status.sh ensure

      - name: Mark review running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pi-pr-review-status.sh running \
            "Automated Pi review started for \`${HEAD_SHA:0:12}\`."

      - name: Create temporary PR worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          rm -rf "$JOB_DIR"
          git fetch origin "$HEAD_REF"
          git worktree prune
          git worktree add --detach "$JOB_DIR" "$HEAD_SHA"
          echo "Temporary review worktree: $JOB_DIR"

      - name: Prepare Python environment
        run: |
          cd "$JOB_DIR"
          python --version
          sqlite3 --version
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
          echo "$JOB_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Run deterministic checks
        id: checks
        run: |
          cd "$JOB_DIR"
          set +e
          pytest > "$RUNNER_TEMP/pytest.log" 2>&1
          PYTEST_EXIT=$?
          ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
          RUFF_EXIT=$?
          set -e

          echo "pytest_exit=$PYTEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "ruff_exit=$RUFF_EXIT" >> "$GITHUB_OUTPUT"

          echo "=== pytest ==="
          cat "$RUNNER_TEMP/pytest.log"
          echo
          echo "=== ruff ==="
          cat "$RUNNER_TEMP/ruff.log"

      - name: Build review context
        env:
          PYTEST_EXIT: ${{ steps.checks.outputs.pytest_exit }}
          RUFF_EXIT: ${{ steps.checks.outputs.ruff_exit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "PI_ISSUE=$ISSUE" >> "$GITHUB_ENV"

          API="https://api.github.com/repos/${REPO}"
          ISSUE_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/issues/${ISSUE}")"
          PR_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/pulls/${PR}")"

          ISSUE_TITLE="$(jq -r '.title // ""' <<<"$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"$ISSUE_JSON")"
          PR_TITLE="$(jq -r '.title // ""' <<<"$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"

          TASK_FILE="$RUNNER_TEMP/pi-review-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/reviewer/AGENTS.md before reviewing.
          
          You are reviewing pull request #${PR} against its linked GitHub issue #${ISSUE}.
          
          Do not modify files.
          Do not commit or push.
          Do not create or edit GitHub comments, reviews, labels, issues, or pull requests.
          Review only the checked-out code and local repository history/diff.
          
          Issue title:
          ${ISSUE_TITLE}
          
          Issue body:
          ${ISSUE_BODY}
          
          Pull request title:
          ${PR_TITLE}
          
          Pull request body:
          ${PR_BODY}
          
          Deterministic check exit codes:
          - pytest: ${PYTEST_EXIT}
          - ruff check .: ${RUFF_EXIT}
          
          The detailed pytest and Ruff logs are available at:
          - $RUNNER_TEMP/pytest.log
          - $RUNNER_TEMP/ruff.log
          
          Inspect the diff against origin/dev and relevant surrounding code.

          Call submit_result exactly once, as your last action, with your verdict.
          EOF

          echo "TASK_FILE=$TASK_FILE" >> "$GITHUB_ENV"

      - name: Run Pi reviewer with live progress
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          RAW="$RUNNER_TEMP/pi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          echo "REVIEW_RAW=$RAW" >> "$GITHUB_ENV"

          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-reviewer-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RAW" \
          | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"

          printf '\n'

      - name: Parse review result
        id: result
        run: |
          if RESULT_JSON="$(node scripts/pi-review-result.mjs "$REVIEW_RAW")"; then
            echo "Pi supplied a valid review result"
          else
            result_exit=$?
            if [ "$result_exit" -ne 3 ] && [ "$result_exit" -ne 4 ]; then exit "$result_exit"; fi
            echo "Pi did not supply a valid verdict; retrying this review once"
            cd "$JOB_DIR"
            set -o pipefail
            RETRY_RAW="$RUNNER_TEMP/pi-review-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
            pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-reviewer-result-tool.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session \
              "Read agents/reviewer/AGENTS.md. Independently review PR #${PR} against issue #${ISSUE} and origin/dev. The first review did not produce a usable final verdict. Do not modify files or GitHub state. The test logs are $RUNNER_TEMP/pytest.log and $RUNNER_TEMP/ruff.log. Call submit_result exactly once, as your last action, with your verdict and evidence." \
              | tee "$RETRY_RAW" | PI_CALL=retry node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
            RESULT_JSON="$(node "$GITHUB_WORKSPACE/scripts/pi-review-result.mjs" "$RETRY_RAW")"
          fi
          VERDICT="$(jq -r '.verdict' <<<"$RESULT_JSON")"
          jq -r '.text' <<<"$RESULT_JSON" > "$RUNNER_TEMP/pi-review-comment.txt"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Verify reviewed head is still current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_PR="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          CURRENT_HEAD="$(jq -r '.head.sha' <<<"$CURRENT_PR")"
          CURRENT_BASE="$(jq -r '.base.sha' <<<"$CURRENT_PR")"
          if [ "$CURRENT_HEAD" = "$HEAD_SHA" ]; then
            echo "head_same=true" >> "$GITHUB_OUTPUT"
          else
            echo "head_same=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CURRENT_HEAD" = "$HEAD_SHA" ] && [ "$CURRENT_BASE" = "$BASE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Reviewed head/base $HEAD_SHA/$BASE_SHA is stale; current pair is $CURRENT_HEAD/$CURRENT_BASE. Verdict will not mutate PR state."
          fi

      - name: Release stale review
        if: steps.freshness.outputs.current == 'false' && steps.freshness.outputs.head_same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pi-pr-review-status.sh stale

      - name: Mark review passed
        id: passed
        if: steps.freshness.outputs.current == 'true' && steps.result.outputs.verdict == 'PASS' && steps.checks.outputs.pytest_exit == '0' && steps.checks.outputs.ruff_exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="$(cat "$RUNNER_TEMP/pi-review-comment.txt")"
          bash scripts/pi-pr-review-status.sh passed "$COMMENT"

      - name: Trigger Pi Auto Merge after passed review
        if: steps.passed.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"dev"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-auto-merge.yml/dispatches"
          echo "Pi Auto Merge dispatched after review of PR #${PR}"

      - name: Mark changes requested
        if: steps.freshness.outputs.current == 'true' && (steps.result.outputs.verdict == 'CHANGES_REQUESTED' || (steps.result.outputs.verdict == 'PASS' && (steps.checks.outputs.pytest_exit != '0' || steps.checks.outputs.ruff_exit != '0')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="$(cat "$RUNNER_TEMP/pi-review-comment.txt")"
          if [ "${{ steps.checks.outputs.pytest_exit }}" != '0' ] || [ "${{ steps.checks.outputs.ruff_exit }}" != '0' ]; then
            COMMENT="Deterministic checks failed (pytest=${{ steps.checks.outputs.pytest_exit }}, Ruff=${{ steps.checks.outputs.ruff_exit }}).\n\n${COMMENT}"
          fi
          bash scripts/pi-pr-review-status.sh changes-requested "$COMMENT"

      - name: Dispatch Pi repair
        if: steps.freshness.outputs.current == 'true' && (steps.result.outputs.verdict == 'CHANGES_REQUESTED' || (steps.result.outputs.verdict == 'PASS' && (steps.checks.outputs.pytest_exit != '0' || steps.checks.outputs.ruff_exit != '0')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg event_type "pi_pr_fix" --arg pr_number "$PR" \
            '{event_type:$event_type,client_payload:{pr_number:$pr_number}}' |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @- "https://api.github.com/repos/${REPO}/dispatches"

      - name: Mark review failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_HEAD="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR}" | jq -r '.head.sha')"
          if [ "${HEAD_SHA:-}" != "$CURRENT_HEAD" ]; then
            echo "Review is stale; not marking the current PR as failed"
            exit 0
          fi
          bash scripts/pi-pr-review-status.sh failed \
            "Automated Pi review workflow failed. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize Pi usage
        if: always()
        run: node scripts/pi-usage-summary.mjs

      - name: Clean temporary review worktree
        if: always()
        run: |
          set +e
          JOB_DIR="${JOB_DIR:-$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          if [ -d "$JOB_DIR" ]; then
            git worktree remove --force "$JOB_DIR"
          fi
          rm -rf "$JOB_DIR"
          rm -f \
            "$RUNNER_TEMP/pytest.log" \
            "$RUNNER_TEMP/ruff.log" \
            "$RUNNER_TEMP/pi-review-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" \
            "$RUNNER_TEMP/pi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" \
            "$RUNNER_TEMP/pi-review-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" \
            "$RUNNER_TEMP/pi-review-comment.txt"
          git worktree prune
