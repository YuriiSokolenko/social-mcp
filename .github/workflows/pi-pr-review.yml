name: Pi PR Review (manual diagnostic)
run-name: "🔬 Diagnostic review PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pi-pr-review-${{ inputs.pr_number }}
  queue: max
  cancel-in-progress: false

jobs:
  review:
    if: contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    env:
      PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      PI_PHASE: review
      PI_BASH_TIMEOUT_SECONDS: '600'
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          [ "$(jq -r '.state' <<<"$PR_JSON")" = "open" ]
          [ "$(jq -r '.draft' <<<"$PR_JSON")" = "false" ]
          [ "$(jq -r '.base.ref' <<<"$PR_JSON")" = "dev" ]
          [ "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$REPO" ]
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$HEAD_REF" == pi/issue-* ]]
          ISSUE="${HEAD_REF#pi/issue-}"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"

      - name: Create review worktree
        run: |
          JOB_DIR="$RUNNER_TEMP/social-mcp-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add --detach "$JOB_DIR" "$HEAD_SHA"

      - name: Run semantic diagnostic review
        run: |
          set -o pipefail
          cd "$JOB_DIR"
          RAW="$RUNNER_TEMP/pi-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
          pi --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" --extension "$GITHUB_WORKSPACE/scripts/pi-reviewer-result-tool.mjs" --provider hp-laguna --model qwen3.8-flash-next --mode json --no-session             "Read agents/reviewer/AGENTS.md. Review PR #${PR} against issue #${ISSUE}. This is diagnostic only: do not modify files or GitHub state. Do not depend on a captured dev SHA or pre-merge CI status. Call submit_result exactly once as your final action."             | tee "$RAW" | PI_CALL=main node "$GITHUB_WORKSPACE/scripts/pi-log-filter.mjs"
          node "$GITHUB_WORKSPACE/scripts/pi-review-result.mjs" "$RAW" | jq -r '.text'

      - name: Clean worktree
        if: always()
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] && [ -d "$JOB_DIR" ] && git worktree remove --force "$JOB_DIR"
          git worktree prune
