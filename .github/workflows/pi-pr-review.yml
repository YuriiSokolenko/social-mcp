name: Pi PR Review
run-name: "🔬 Review PR #${{ inputs.pr_number || github.event.pull_request.number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      model:
        description: Model backend override; default reads .pi/default-model
        required: true
        default: default
        type: choice
        options:
          - default
          - laguna
          - qwen
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # synchronize has no inputs: key its invalidation per PR so pushes to different PRs never
  # share a group (GitHub cancels older pending runs in a group, which would drop an invalidation).
  group: ${{ github.event_name == 'pull_request' && format('pi-pr-review-invalidate-{0}', github.event.pull_request.number) || format('pi-pr-review-{0}', inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  invalidate:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'pi/issue-')
    runs-on: [self-hosted, linux, x64, n150, general]
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Invalidate stale review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" invalidate "$PR"

  review:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["RUNNING","DRAINING"]'), vars.PI_AUTOMATION_MODE)
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    outputs:
      independent_outcome: ${{ steps.independent.outcome }}
      head_sha: ${{ steps.load.outputs.head_sha }}
      model: ${{ inputs.model || 'default' }}
    env:
      PR: ${{ inputs.pr_number }}
      PI_MODEL_CHOICE: ${{ inputs.model || 'default' }}
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: dev

      - name: Load and guard PR
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTEXT="$RUNNER_TEMP/pi-pr-context.json"
          node "$GITHUB_WORKSPACE/scripts/pi-common/pr-guard.mjs" "$PR" "$CONTEXT"
          echo "skip=$(jq -r '.skip' "$CONTEXT")" >> "$GITHUB_OUTPUT"
          echo "ISSUE=$(jq -r '.issue' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_REF=$(jq -r '.branch' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(jq -r '.head' "$CONTEXT")" >> "$GITHUB_ENV"
          echo "head_sha=$(jq -r '.head' "$CONTEXT")" >> "$GITHUB_OUTPUT"
          echo "REVIEW_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Create review worktree
        if: steps.load.outputs.skip != 'true'
        run: |
          JOB_DIR="$RUNNER_TEMP/agent-reviewer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_REF"
          git worktree add --detach "$JOB_DIR" "$HEAD_SHA"

      - name: Prepare environment
        if: steps.load.outputs.skip != 'true'
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/prepare-environment.mjs" reviewer "$JOB_DIR"

      - name: Run deterministic review checks
        id: checks
        if: steps.load.outputs.skip != 'true'
        continue-on-error: true
        run: |
          cd "$JOB_DIR"
          node "$GITHUB_WORKSPACE/scripts/pi-common/product-checks.mjs"

      - name: Mark deterministic check failure for repair
        if: steps.load.outputs.skip != 'true' && steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" dispatch "$PR" CHANGES_REQUESTED

      - name: Run independent review
        id: independent
        if: steps.load.outputs.skip != 'true' && steps.checks.outcome == 'success'
        continue-on-error: true
        run: |
          cd "$JOB_DIR"
          RAW="$RUNNER_TEMP/pi-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
          node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" reviewer --raw "$RAW"
          node "$GITHUB_WORKSPACE/scripts/pi-review-result.mjs" "$RAW" > "$RUNNER_TEMP/review-result.json"
          jq -r '.text' "$RUNNER_TEMP/review-result.json"

      - name: Preserve reviewer trace
        if: always() && steps.load.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-trace-pr-${{ inputs.pr_number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-review-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply review result
        if: steps.load.outputs.skip != 'true' && steps.checks.outcome == 'success' && steps.independent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$RUNNER_TEMP/review-result.json"
          VERDICT="$(jq -r '.verdict' "$RESULT")"
          jq -r '.text' "$RESULT" > "$RUNNER_TEMP/review-comment.txt"
          APPLIED="$(node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" apply "$PR" "$HEAD_SHA" "$VERDICT" "$RUNNER_TEMP/review-comment.txt")"
          STATUS="$(jq -r '.status' <<<"$APPLIED")"
          if [ "$STATUS" = "human" ]; then
            echo "PR #$PR became human-gated during review; discarding the automated verdict"
            echo "HUMAN_GATED=true" >> "$GITHUB_ENV"
          elif [ "$STATUS" = "stale" ]; then
            echo "PR #$PR changed during review; stale verdict cleared"
            echo "STALE_REVIEW=true" >> "$GITHUB_ENV"
          else
            echo "VERDICT=$VERDICT" >> "$GITHUB_ENV"
          fi

      - name: Start PR Fix after changes requested
        if: steps.load.outputs.skip != 'true' && (env.VERDICT == 'CHANGES_REQUESTED')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" dispatch "$PR" CHANGES_REQUESTED

      - name: Wake merge gate after PASS
        if: steps.load.outputs.skip != 'true' && (env.VERDICT == 'PASS')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" dispatch "$PR" PASS

  recover_failed_review:
    needs: review
    if: always() && contains(fromJSON('["failure","cancelled"]'), needs.review.outputs.independent_outcome)
    runs-on: [self-hosted, linux, x64, n150, general]
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Persist failure and request bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REVIEW_OUTCOME: ${{ needs.review.outputs.independent_outcome }}
          REVIEW_MODEL: ${{ needs.review.outputs.model }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/review-state.mjs" recover-failure "$PR" "$HEAD_SHA" "$GITHUB_RUN_ID"
