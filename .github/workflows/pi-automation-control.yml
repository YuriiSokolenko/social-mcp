name: Pi Automation Control
run-name: "⚙️ Automation · ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Automation mode
        required: true
        default: RUNNING
        type: choice
        options:
          - RUNNING
          - DRAINING
          - PAUSED

permissions:
  actions: write
  contents: read

jobs:
  control:
    runs-on: [self-hosted, linux, x64, n150, general]
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: dev

      - name: Set automation mode
        env:
          # GITHUB_TOKEN cannot update repository variables. This secret needs
          # repository Variables: write permission (and no other write scope).
          GITHUB_TOKEN: ${{ secrets.PI_CONTROL_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          [ -n "$GITHUB_TOKEN" ] || { echo "Missing Actions secret PI_CONTROL_TOKEN (repository Variables: write)." >&2; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/pi-common/automation-control.mjs" set "$MODE"
          echo "PI automation mode: $MODE"

      - name: Resume dispatcher
        if: inputs.mode == 'RUNNING'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-common/automation-control.mjs" resume
