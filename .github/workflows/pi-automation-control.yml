name: Pi Automation Control
run-name: "⚙️ Automation · ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Automation mode
        required: true
        default: RUNNING
        type: choice
        options:
          - RUNNING
          - DRAINING
          - PAUSED

permissions:
  actions: write
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Set automation mode
        env:
          # GITHUB_TOKEN cannot update repository variables. This secret needs
          # repository Variables: write permission (and no other write scope).
          GH_TOKEN: ${{ secrets.PI_CONTROL_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing Actions secret PI_CONTROL_TOKEN (repository Variables: write)." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg value "$MODE" '{value:$value}')" \
            "https://api.github.com/repos/${REPO}/actions/variables/PI_AUTOMATION_MODE"
          actual="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/variables/PI_AUTOMATION_MODE" \
            | jq -r '.value')"
          if [ "$actual" != "$MODE" ]; then
            echo "Automation mode verification failed: expected $MODE, got $actual" >&2
            exit 1
          fi
          echo "PI automation mode: $MODE"

      - name: Resume dispatcher
        if: inputs.mode == 'RUNNING'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"dev"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-dispatcher.yml/dispatches"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"dev","inputs":{"apply_safe_repairs":"true"}}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pi-reconcile.yml/dispatches"
