name: Pi Dispatcher
run-name: "🚦 Dispatcher · ${{ github.event_name == 'pull_request' && format('merged PR #{0}', github.event.pull_request.number) || 'queue scan' }}"

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-dispatcher
  cancel-in-progress: false

jobs:
  dispatcher:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'))
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    env:
      REPO: ${{ github.repository }}
      PI_BASH_TIMEOUT_SECONDS: '600'

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Prepare dispatcher context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pi-dispatcher.mjs prepare "$RUNNER_TEMP/pi-dispatcher-context.json"
          if jq -e '(.candidates | length > 0)' "$RUNNER_TEMP/pi-dispatcher-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi dispatcher
        if: steps.prepare.outputs.run == 'true'
        run: |
          set -o pipefail
          TASK_FILE="$RUNNER_TEMP/pi-dispatcher-task.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/dispatcher/AGENTS.md.
          Read $RUNNER_TEMP/pi-dispatcher-context.json and the task file for each entry in candidates.
          The candidates list is authoritative: do not re-check eligibility, dependencies, priority, ordering or capacity.
          For every candidate decide only IMPLEMENT or ARCHITECT based on scope.
          Call submit_result exactly once as your last action. Do not modify repository or GitHub state.
          EOF
          pi \
            --extension "$GITHUB_WORKSPACE/scripts/pi-bash-timeout.mjs" \
            --extension "$GITHUB_WORKSPACE/scripts/pi-dispatcher-result-tool.mjs" \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RUNNER_TEMP/pi-dispatcher-result.jsonl" \
          | node scripts/pi-log-filter.mjs

      - name: Validate and start selected issues
        if: steps.prepare.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pi-dispatcher.mjs apply "$RUNNER_TEMP/pi-dispatcher-result.jsonl"
