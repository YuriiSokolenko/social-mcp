name: Pi Dispatcher
run-name: "🚦 Dispatcher · queue scan"

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model backend override; default reads .pi/default-model
        required: true
        default: default
        type: choice
        options:
          - default
          - laguna
          - qwen
  issues:
    types: [labeled, closed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-dispatcher
  cancel-in-progress: false

jobs:
  dispatcher:
    if: vars.PI_AUTOMATION_MODE == 'RUNNING' && (github.event_name != 'issues' || github.event.action == 'closed' || github.event.label.name == 'dispatcher:ready')
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 480
    env:
      PI_MODEL_CHOICE: ${{ inputs.model || 'default' }}
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Reconcile completed issue hierarchy
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-issue-reconcile.mjs" "${{ github.event.issue.number }}"

      - name: Prepare dispatcher context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/pi-dispatcher.mjs" prepare "$RUNNER_TEMP/pi-dispatcher-context.json"
          if jq -e '(.candidates | length > 0)' "$RUNNER_TEMP/pi-dispatcher-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi dispatcher
        if: steps.prepare.outputs.run == 'true'
        run: node "$GITHUB_WORKSPACE/scripts/pi-run-stage.mjs" dispatcher --raw "$RUNNER_TEMP/pi-dispatcher-result.jsonl"

      - name: Validate and start selected issues
        if: vars.PI_AUTOMATION_MODE == 'RUNNING' && steps.prepare.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/pi-dispatcher.mjs" apply "$RUNNER_TEMP/pi-dispatcher-result.jsonl"

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-diagnostics-dispatcher-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-diagnostics-dispatcher-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: ignore
          retention-days: 7
