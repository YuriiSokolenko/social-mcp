name: Pi Dispatcher

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pi-dispatcher
  cancel-in-progress: false

jobs:
  dispatcher:
    if: vars.PI_AUTOMATION_MODE != 'PAUSED' && vars.PI_AUTOMATION_MODE != 'DRAINING' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'))
    runs-on: [self-hosted, linux, x64, n150, pi-agent]
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Prepare dispatcher context
        id: prepare
        run: |
          node scripts/pi-dispatcher.mjs prepare "$RUNNER_TEMP/pi-dispatcher-context.json"
          if jq -e '(.candidates | length > 0)' "$RUNNER_TEMP/pi-dispatcher-context.json" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pi dispatcher
        if: steps.prepare.outputs.run == 'true'
        run: |
          set -o pipefail
          TASK_FILE="$RUNNER_TEMP/pi-dispatcher-task.txt"
          cat > "$TASK_FILE" <<EOF
          Read and follow agents/dispatcher/AGENTS.md and docs/PROJECT_CONTEXT.md.
          The current GitHub issue and PR snapshot is at $RUNNER_TEMP/pi-dispatcher-context.json.
          Read the snapshot and relevant tasks/<issue-number>.md files.
          Select all eligible candidates in priority order. Execution concurrency is controlled by the GitHub Actions queue and the N150 autoscaler, not by the dispatcher.
          Return the exact DISPATCH_RESULT line specified by your role rules.
          Do not modify the repository or GitHub state.
          EOF
          pi \
            --provider hp-laguna \
            --model qwen3.8-flash-next \
            --mode json \
            --no-session \
            "$(cat "$TASK_FILE")" \
          | tee "$RUNNER_TEMP/pi-dispatcher-result.jsonl" \
          | node scripts/pi-log-filter.mjs

      - name: Validate and start selected issues
        if: steps.prepare.outputs.run == 'true'
        run: node scripts/pi-dispatcher.mjs apply "$RUNNER_TEMP/pi-dispatcher-result.jsonl"
