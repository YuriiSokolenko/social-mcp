name: Pi Pipeline Reconciler
run-name: "🧭 Reconcile pipeline state"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-pipeline-reconciler
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Audit and reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          PI_AUTOMATION_MODE: ${{ vars.PI_AUTOMATION_MODE }}
        run: node scripts/pi-reconcile.mjs --apply
