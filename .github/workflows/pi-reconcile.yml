name: Pi Pipeline Reconciler
run-name: "🧭 Reconcile pipeline state"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pi-pipeline-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'pi/issue-'))
    runs-on: [self-hosted, linux, x64, n150, general]
    timeout-minutes: 5
    steps:
      - name: Checkout trusted dev
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      - name: Audit and reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          PI_AUTOMATION_MODE: ${{ vars.PI_AUTOMATION_MODE }}
        run: node scripts/pi-reconcile.mjs --apply
