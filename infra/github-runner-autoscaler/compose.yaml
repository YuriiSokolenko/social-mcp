services:
  pi-runner-manager:
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/manager.Dockerfile
    image: ${PI_RUNNER_MANAGER_IMAGE:-n150/pi-runner-manager:run-check-docker-0.1.10}
    container_name: pi-runner-manager
    restart: unless-stopped
    environment:
      GH_ADMIN_TOKEN: ${GH_ADMIN_TOKEN}
      SCHEDULER_STATE_DIR: /scheduler
      HOST_MAX_EPHEMERAL: ${HOST_MAX_EPHEMERAL:-12}
      HOST_MEMORY_RESERVE_MB: ${HOST_MEMORY_RESERVE_MB:-3072}
      WORKER_MEMORY_MB: "512"
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      MAX_RUNNERS: ${MAX_RUNNERS:-}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-}
      POLL_SECONDS: ${POLL_SECONDS:-}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-}
      RUN_CHECK_SANDBOX_IMAGE: ${RUN_CHECK_SANDBOX_IMAGE:-n150/run-check-sandbox:0.1.4}
      RUN_CHECK_EXECUTOR_URL: ${RUN_CHECK_EXECUTOR_URL:-http://127.0.0.1:17343}
      RUN_CHECK_EXECUTOR_PORT: ${RUN_CHECK_EXECUTOR_PORT:-17343}
      RUN_CHECK_STAGE_VOLUME: ${RUN_CHECK_STAGE_VOLUME:-social-mcp-run-check-stage}
      RUN_CHECK_EXECUTOR_ENABLED: "true"
      RUNNER_PREFIX: ${RUNNER_PREFIX:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      PI_ZOEKT_URL: ${PI_ZOEKT_URL:-}
      PI_ZOEKT_REPOSITORY: ${PI_ZOEKT_REPOSITORY:-}
      PI_ZOEKT_TIMEOUT_MS: ${PI_ZOEKT_TIMEOUT_MS:-}
      WORKFLOW_FILES: ${WORKFLOW_FILES:-}
      MODEL_STATUS_URL: ${MODEL_STATUS_URL:-}
      MOUNT_PI_CONFIG: "true"
      MOUNT_DOCKER_SOCKET: "false"
      PI_CONFIG_DIR: ${PI_HOME_HOST}/.pi/agent
      CURL_CONNECT_TIMEOUT_SECONDS: ${CURL_CONNECT_TIMEOUT_SECONDS:-}
      CURL_MAX_TIME_SECONDS: ${CURL_MAX_TIME_SECONDS:-}
      DOCKER_TIMEOUT_SECONDS: ${DOCKER_TIMEOUT_SECONDS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-scheduler:/scheduler
      - run-check-stage:/run-check-stage
    ports:
      - "127.0.0.1:${RUN_CHECK_EXECUTOR_PORT:-17343}:17343"

  # Second, independent pool: CI validation (ci.yml's `test`/`docker`
  # jobs) and non-model recovery/accounting jobs. Kept as a separate manager instance
  # rather than folded into one multi-pool process, so the two pools scale,
  # fail, and get restarted independently -- a stuck GitHub/model call in one
  # pool's loop can never block the other's.
  general-runner-manager:
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/manager.Dockerfile
    image: ${PI_RUNNER_MANAGER_IMAGE:-n150/pi-runner-manager:run-check-docker-0.1.10}
    container_name: general-runner-manager
    restart: unless-stopped
    environment:
      GH_ADMIN_TOKEN: ${GH_ADMIN_TOKEN}
      SCHEDULER_STATE_DIR: /scheduler
      HOST_MAX_EPHEMERAL: ${HOST_MAX_EPHEMERAL:-12}
      HOST_MEMORY_RESERVE_MB: ${HOST_MEMORY_RESERVE_MB:-3072}
      WORKER_MEMORY_MB: "512"
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-YuriiSokolenko/social-mcp}
      MAX_RUNNERS: ${GENERAL_MAX_RUNNERS:-3}
      POLL_SECONDS: ${GENERAL_POLL_SECONDS:-6}
      RUNNER_IMAGE: ${GENERAL_RUNNER_IMAGE:-n150/github-general-runner-ephemeral:0.87.11}
      RUNNER_PREFIX: ${GENERAL_RUNNER_PREFIX:-n150-gen-eph}
      RUNNER_LABELS: ${GENERAL_RUNNER_LABELS:-n150,general}
      WORKFLOW_FILES: ${GENERAL_WORKFLOW_FILES:-ci.yml,pi-auto-merge.yml,pi-reconcile.yml,pi-usage.yml}
      MODEL_STATUS_URL: ""
      MOUNT_PI_CONFIG: "false"
      MOUNT_DOCKER_SOCKET: "true"
      PIP_CACHE_HOST_DIR: ${PIP_CACHE_HOST_DIR:-}
      RUN_CHECK_EXECUTOR_ENABLED: "false"
      PI_CONFIG_DIR: ""
      CURL_CONNECT_TIMEOUT_SECONDS: ${CURL_CONNECT_TIMEOUT_SECONDS:-5}
      CURL_MAX_TIME_SECONDS: ${CURL_MAX_TIME_SECONDS:-15}
      DOCKER_TIMEOUT_SECONDS: ${DOCKER_TIMEOUT_SECONDS:-30}
      DOCKER_DEEP_PROBE_INTERVAL_SECONDS: ${GENERAL_DOCKER_DEEP_PROBE_INTERVAL_SECONDS:-300}
      INFRA_EVIDENCE_DIR: /evidence
      INFRA_EVIDENCE_VOLUME: ${GENERAL_EVIDENCE_VOLUME:-social-mcp-general-runner-evidence}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-scheduler:/scheduler
      - general-runner-evidence:/evidence

  # Opt-in only: owner preflight must prove sandbox compatibility first.
  recursive-coder-runner-manager:
    profiles: [recursive-coder]
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/manager.Dockerfile
    image: n150/recursive-coder-runner-manager:0.1.0
    container_name: recursive-coder-runner-manager
    restart: unless-stopped
    environment:
      GH_ADMIN_TOKEN: ${RECURSIVE_CODER_GH_ADMIN_TOKEN:-}
      GITHUB_REPOSITORY: YuriiSokolenko/recursive-coder
      MAX_RUNNERS: "1"
      POLL_SECONDS: "30"
      RUNNER_IMAGE: n150/github-recursive-coder-runner-ephemeral:0.1.0
      RUNNER_PREFIX: n150-rc-eph
      RUNNER_LABELS: n150,recursive-coder-ci
      WORKFLOW_FILES: ci.yml
      MODEL_STATUS_URL: ""
      MOUNT_PI_CONFIG: "false"
      MOUNT_DOCKER_SOCKET: "false"
      RUN_CHECK_EXECUTOR_ENABLED: "false"
      WORKER_NETWORK: bridge
      WORKER_HARDENED: "true"
      WORKER_CPUS: "2"
      WORKER_MEMORY_MB: "4096"
      SCHEDULER_STATE_DIR: /scheduler
      HOST_MAX_EPHEMERAL: ${HOST_MAX_EPHEMERAL:-12}
      LEGACY_RESERVED_RUNNERS: ${LEGACY_RESERVED_RUNNERS:-11}
      HOST_MEMORY_RESERVE_MB: ${HOST_MEMORY_RESERVE_MB:-3072}
    cpus: 0.25
    mem_limit: 256m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-scheduler:/scheduler

  # Isolated VM backend. This manager has KVM access but no Docker socket,
  # Pi config, host shares, TAP/bridge, or guest inbound forwarding.
  recursive-coder-kvm-runner-manager:
    profiles: [recursive-coder-kvm]
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/kvm-manager.Dockerfile
    image: n150/recursive-coder-kvm-runner-manager:0.1.0
    container_name: recursive-coder-kvm-runner-manager
    restart: unless-stopped
    init: true
    environment:
      GH_ADMIN_TOKEN: ${RECURSIVE_CODER_GH_ADMIN_TOKEN:-}
      GITHUB_REPOSITORY: YuriiSokolenko/recursive-coder
      MAX_RUNNERS: "1"
      POLL_SECONDS: "30"
      RUNNER_PREFIX: n150-rc-eph
      RUNNER_LABELS: n150,recursive-coder-ci
      WORKFLOW_FILES: ci.yml
      WORKER_BACKEND: kvm
      MOUNT_PI_CONFIG: "false"
      MOUNT_DOCKER_SOCKET: "false"
      RUN_CHECK_EXECUTOR_ENABLED: "false"
      WORKER_CPUS: "2"
      WORKER_MEMORY_MB: "5120"
      KVM_GUEST_CPUS: "2"
      KVM_GUEST_MEMORY_MB: "4096"
      KVM_OVERLAY_MAX_GIB: "24"
      KVM_MAX_LIFETIME_SECONDS: "1800"
      KVM_IDLE_POLLS_BEFORE_STOP: "4"
      KVM_MIN_HOST_CPU_HEADROOM: "1"
      KVM_GOLDEN_IMAGE: /golden/${KVM_GOLDEN_FILENAME:-noble-server-cloudimg-amd64.img}
      KVM_GOLDEN_SHA256: ${KVM_GOLDEN_SHA256:-6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2}
      KVM_STATE_DIR: /kvm-state
      KVM_PROXY_PORT: "43128"
      KVM_PROXY_BRIDGE: /usr/local/bin/kvm-proxy-bridge
      KVM_START_TIMEOUT_SECONDS: "60"
      SCHEDULER_STATE_DIR: /scheduler
      HOST_MAX_EPHEMERAL: ${HOST_MAX_EPHEMERAL:-12}
      LEGACY_RESERVED_RUNNERS: ${LEGACY_RESERVED_RUNNERS:-11}
      HOST_MEMORY_RESERVE_MB: ${HOST_MEMORY_RESERVE_MB:-3072}
      CURL_CONNECT_TIMEOUT_SECONDS: ${CURL_CONNECT_TIMEOUT_SECONDS:-5}
      CURL_MAX_TIME_SECONDS: ${CURL_MAX_TIME_SECONDS:-15}
      DOCKER_TIMEOUT_SECONDS: ${DOCKER_TIMEOUT_SECONDS:-30}
    cpus: 2.25
    mem_limit: 5120m
    # Docker's memswap_limit is total RAM + swap. Keep the observed ~2.38 GiB
    # validation swap use possible while bounding this pool to 3 GiB of swap.
    memswap_limit: 8192m
    pids_limit: 1024
    devices:
      - /dev/kvm:/dev/kvm:rwm
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ${KVM_GOLDEN_HOST_DIR:-/var/lib/recursive-coder-kvm/golden}:/golden:ro
      - ${KVM_STATE_HOST_DIR:-/var/lib/recursive-coder-kvm/state}:/kvm-state
      - runner-scheduler:/scheduler

  # Always-on control-plane lane for tiny orchestration jobs. This runner is
  # intentionally not autoscaled and cannot satisfy jobs requiring `general`
  # or `pi-agent`.
  control-runner:
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/control-runner.Dockerfile
    image: ${CONTROL_RUNNER_IMAGE:-n150/github-control-runner:0.1.8}
    container_name: ${CONTROL_RUNNER_NAME:-n150-control}
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      GH_ADMIN_TOKEN: ${GH_ADMIN_TOKEN}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-YuriiSokolenko/social-mcp}
      RUNNER_NAME: ${CONTROL_RUNNER_NAME:-n150-control}
      RUNNER_LABELS: ${CONTROL_RUNNER_LABELS:-n150,control}
      CONTROL_REPAIR_COOLDOWN_SECONDS: ${CONTROL_REPAIR_COOLDOWN_SECONDS:-300}
      CONTROL_RETRY_SECONDS: ${CONTROL_RETRY_SECONDS:-30}
      CONTROL_SHORT_RETRY_SECONDS: ${CONTROL_SHORT_RETRY_SECONDS:-5}
      CONTROL_UPDATE_WAIT_SECONDS: ${CONTROL_UPDATE_WAIT_SECONDS:-30}
      CONTROL_UPDATE_SHUTDOWN_WAIT_SECONDS: ${CONTROL_UPDATE_SHUTDOWN_WAIT_SECONDS:-90}
      CONTROL_CHILD_STOP_WAIT_SECONDS: ${CONTROL_CHILD_STOP_WAIT_SECONDS:-30}
    cpus: 1.00
    mem_limit: 1g
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - KILL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - control-runner-state:/home/runner/actions-runner

volumes:
  runner-scheduler:
    name: social-mcp-runner-scheduler
  control-runner-state:
    name: ${CONTROL_RUNNER_STATE_VOLUME:-social-mcp-control-runner-state}
  general-runner-evidence:
    name: ${GENERAL_EVIDENCE_VOLUME:-social-mcp-general-runner-evidence}
  run-check-stage:
    name: ${RUN_CHECK_STAGE_VOLUME:-social-mcp-run-check-stage}
