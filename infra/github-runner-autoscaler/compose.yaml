services:
  pi-runner-manager:
    build:
      context: ../..
      dockerfile: infra/github-runner-autoscaler/manager.Dockerfile
    image: n150/pi-runner-manager:latest
    container_name: pi-runner-manager
    restart: unless-stopped
    environment:
      GH_ADMIN_TOKEN: ${GH_ADMIN_TOKEN}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-YuriiSokolenko/social-mcp}
      MAX_RUNNERS: ${MAX_RUNNERS:-2}
      POLL_SECONDS: ${POLL_SECONDS:-10}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-n150/github-pi-runner-ephemeral:0.87.1}
      RUNNER_PREFIX: ${RUNNER_PREFIX:-n150-pi-eph}
      WORKFLOW_FILES: ${WORKFLOW_FILES:-pi-issue-agent.yml,pi-pr-review.yml,pi-dispatcher.yml,pi-architect.yml}
      MODEL_STATUS_URL: ${MODEL_STATUS_URL:-}
      PI_CONFIG_DIR: ${PI_HOME_HOST}/.pi/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
