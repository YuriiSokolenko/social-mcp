services:
  zoekt-web:
    # Pin the upstream image digest so indexer and webserver upgrades are deliberate.
    image: ghcr.io/sourcegraph/zoekt@sha256:403b51206099f04d53bb7fcdfed0c81a20f263722f287cb7830376fd6a7c3923
    container_name: social-mcp-zoekt
    restart: unless-stopped
    command: ["zoekt-webserver", "-index", "/data/index", "-listen", "0.0.0.0:6070", "-rpc"]
    ports:
      - "127.0.0.1:6070:6070"
    volumes:
      - ${ZOEKT_INDEX_DIR:-/home/yurasik/zoekt-social-mcp/index}:/data/index:ro
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
